name: Build AUR Package & Upload to Release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name (e.g. ryujinx-canary)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Update System and Install Base Dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli || true

      - name: Setup Unprivileged Builder User
        run: |
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers || true

      - name: Clone and Build Package
        run: |
          su builder -c "
            cd /tmp || true
            git clone https://aur.archlinux.org/${{ github.event.inputs.package_name }}.git || true
            cd ${{ github.event.inputs.package_name }} || true

            # Fix prepare() for ryujinx-canary
            if [ \"${{ github.event.inputs.package_name }}\" = \"ryujinx-canary\" ]; then
              echo 'Overriding prepare() in PKGBUILD for ryujinx-canary...'
              sed -i '/prepare() {/,/}/c\prepare() {\n  cp \"\$_pkgsrc\"/global.json global.json 2>/dev/null || true\n  rm -f global.json \"\$_pkgsrc\"/global.json\n}' PKGBUILD || true
            fi

            # --skippgpcheck skips PGP signature verification
            # --skipinteg skips MD5, SHA1, SHA256, SHA512 checksum checks
            makepkg -s --noconfirm || true
          "

      - name: Upload Package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find all .pkg.tar.zst files generated during the build
          mapfile -t PKG_FILES < <(find /tmp -name "*.pkg.tar.zst" 2>/dev/null)

          if [ ${#PKG_FILES[@]} -eq 0 ]; then
            echo "Error: No .pkg.tar.zst files found after build attempt."
            exit 1
          fi

          echo "Found ${#PKG_FILES[@]} package file(s):"
          printf '%s\n' "${PKG_FILES[@]}"

          # Upload all found files to the release
          gh release upload mr "${PKG_FILES[@]}" --repo Methusan105/archconfig --clobber
