name: Build AUR Package & Upload to Release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name (e.g. spotify, ryujinx-canary)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Update System and Install Base Dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli gnupg curl || true

      - name: Setup Unprivileged Builder User
        run: |
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers || true

      - name: Clone and Build Package
        run: |
          su builder -c "
            cd /tmp || true
            git clone https://aur.archlinux.org/${{ github.event.inputs.package_name }}.git || true
            cd ${{ github.event.inputs.package_name }} || true

            # Spotify GPG key import
            if [ \"${{ github.event.inputs.package_name }}\" = \"spotify\" ]; then
              echo 'Importing Spotify OpenPGP key...'
              curl -sS https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg | gpg --import -
            fi

            # Fix prepare() for ryujinx-canary
            if [ \"${{ github.event.inputs.package_name }}\" = \"ryujinx-canary\" ]; then
              echo 'Overriding prepare() in PKGBUILD for ryujinx-canary...'
              sed -i '/prepare() {/,/}/c\prepare() {\n  cp \"\$_pkgsrc\"/global.json global.json 2>/dev/null || true\n  rm -f global.json \"\$_pkgsrc\"/global.json\n}' PKGBUILD || true
            fi

            # Update pkgver and skip checksum check for freesmlauncher
            if [ \"${{ github.event.inputs.package_name }}\" = \"freesmlauncher\" ]; then
              echo 'Updating pkgver to 2.3.1 for freesmlauncher...'
              sed -i 's/^pkgver=2\.3\.0$/pkgver=2.3.1/' PKGBUILD || true
              sed -i \"s/^sha256sums=(.*/sha256sums=('SKIP')/\" PKGBUILD || true
            fi
            
            # Fix PKGBUILD for OpenNOW 1.0.1 structure
            if [ \"${{ github.event.inputs.package_name }}\" = \"opennow\" ]; then
              echo 'Updating pkgver and fixing source directory paths for OpenNOW 1.0.1...'
              sed -i 's/^pkgver=.*/pkgver=1.0.1/' PKGBUILD || true
              sed -i 's/^_pkgver=.*/_pkgver=1.0.1/' PKGBUILD || true
              sed -i '/^sha256sums=(/,/)/c\sha256sums=(\x27SKIP\x27 \x27SKIP\x27 \x27SKIP\x27)' PKGBUILD || true

              # Remove obsolete "cd opennow-stable" commands
              sed -i '/cd opennow-stable/d' PKGBUILD || true

              # Remove "opennow-stable/" path prefixes from PKGBUILD
              sed -i 's/opennow-stable\///g' PKGBUILD || true
            fi

            # Build package
            makepkg -s --noconfirm || true
          "

      - name: Upload Package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t PKG_FILES < <(find /tmp -name "*.pkg.tar.zst" 2>/dev/null)

          if [ ${#PKG_FILES[@]} -eq 0 ]; then
            echo "Error: No .pkg.tar.zst files found after build attempt."
            exit 1
          fi

          echo "Found ${#PKG_FILES[@]} package file(s):"
          printf '%s\n' "${PKG_FILES[@]}"

          gh release upload mr "${PKG_FILES[@]}" --repo Methusan105/archconfig --clobber
