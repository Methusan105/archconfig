name: Build AUR Package & Upload to Release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name (e.g. geforce-infinity or ryujinx-canary)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Update System and Install Base Dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli

      - name: Setup Unprivileged Builder User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Install AUR Helper (yay)
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
          "

      - name: Build Package & Dependencies via yay
        run: |
          su builder -c "
            # Download and build target + AUR dependencies. 
            # --noinstall builds the .pkg.tar.zst without installing the main package.
            yay -S --noconfirm --needed --noinstall ${{ github.event.inputs.package_name }}
          "

      - name: Upload Package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Locate all compiled package archives created inside builder's home directory
          mapfile -t PKG_FILES < <(find /home/builder/.cache/yay/ -name "*.pkg.tar.zst" 2>/dev/null)

          if [ ${#PKG_FILES[@]} -eq 0 ]; then
            echo "Error: No .pkg.tar.zst files found after build attempt."
            exit 1
          fi

          echo "Found ${#PKG_FILES[@]} package file(s):"
          printf '%s\n' "${PKG_FILES[@]}"

          # Upload all found binary packages to the GitHub release
          gh release upload mr "${PKG_FILES[@]}" --repo Methusan105/archconfig --clobber
