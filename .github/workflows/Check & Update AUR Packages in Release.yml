name: Check & Update AUR Packages in Release

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli jq curl || true

      - name: Setup Unprivileged Builder User
        run: |
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers || true
          mkdir -p /tmp/builds
          chown -R builder:builder /tmp/builds

      - name: Fetch Current Release Assets & Check Against AUR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching assets from release 'mr'..."
          ASSETS=$(gh release view mr --repo Methusan105/archconfig --json assets -q '.assets[].name' | grep '\.pkg\.tar\.zst$' || true)

          if [ -z "$ASSETS" ]; then
            echo "No .pkg.tar.zst assets found in the 'mr' release."
            exit 0
          fi

          echo "Found existing package files in release:"
          echo "$ASSETS"
          echo "--------------------------------------------------"

          # Extract unique package names from asset filenames
          PKGNAMES=$(echo "$ASSETS" | sed -E 's/-[^-]+-[^-]+-[^-]+\.pkg\.tar\.zst$//' | sort -u)

          for PKGNAME in $PKGNAMES; do
            echo "Evaluating Package: $PKGNAME"

            # Clean and prepare directory with builder permissions
            rm -rf /tmp/builds/$PKGNAME
            mkdir -p /tmp/builds/$PKGNAME
            chown -R builder:builder /tmp/builds/$PKGNAME

            # Clone AUR repository
            su builder -c "
              cd /tmp/builds/$PKGNAME || exit 1
              git clone https://aur.archlinux.org/${PKGNAME}.git repo || exit 1
            " || {
              echo "  [SKIP] Failed to clone $PKGNAME from AUR."
              continue
            }

            # Determine expected package filename ignoring checks/architectures
            EXPECTED_PKG_PATH=$(su builder -c "
              cd /tmp/builds/$PKGNAME/repo || exit 1
              makepkg --packagelist --skippgpcheck --skipinteg --skipchecksums 2>/dev/null
            " | head -n 1)

            EXPECTED_PKG_NAME=$(basename "$EXPECTED_PKG_PATH")

            echo "  Expected Latest Filename: $EXPECTED_PKG_NAME"

            # Check if expected package file already exists in current release assets
            if echo "$ASSETS" | grep -qFx "$EXPECTED_PKG_NAME"; then
              echo "  [UP TO DATE] $EXPECTED_PKG_NAME is already in the release."
            else
              echo "  [UPDATE AVAILABLE] Building $EXPECTED_PKG_NAME..."

              # Build package as builder user skipping all signature, integrity, and architecture verification checks
              su builder -c "
                cd /tmp/builds/$PKGNAME/repo || exit 1

                # Specific fix for ryujinx-canary prepare() function
                if [ \"${PKGNAME}\" = \"ryujinx-canary\" ]; then
                  echo 'Applying ryujinx-canary prepare() patch...'
                  sed -i '/prepare() {/,/}/c\prepare() {\n  cp \"\$_pkgsrc\"/global.json global.json 2>/dev/null || true\n  rm -f global.json \"\$_pkgsrc\"/global.json\n}' PKGBUILD || true
                fi

                makepkg -s --noconfirm --skippgpcheck --skipinteg --skipchecksums --ignorearch || true
              "

              NEW_PKG_PATH=$(find /tmp/builds/$PKGNAME/repo -name "*.pkg.tar.zst" 2>/dev/null | head -n 1)

              if [ -n "$NEW_PKG_PATH" ]; then
                # Find and remove old release asset for this package (if any)
                OLD_ASSET=$(echo "$ASSETS" | grep -E "^${PKGNAME}-[0-9].*\\.pkg\\.tar\\.zst$" || true)
                if [ -n "$OLD_ASSET" ] && [ "$OLD_ASSET" != "$EXPECTED_PKG_NAME" ]; then
                  echo "  Deleting outdated release asset: $OLD_ASSET"
                  gh release delete-asset mr "$OLD_ASSET" --repo Methusan105/archconfig -y || true
                fi

                echo "  Uploading new release asset: $EXPECTED_PKG_NAME"
                gh release upload mr "$NEW_PKG_PATH" --repo Methusan105/archconfig --clobber
                echo "  Successfully updated $PKGNAME!"
              else
                echo "  [ERROR] Build completed but no .pkg.tar.zst was generated for $PKGNAME."
              fi
            fi

            echo "--------------------------------------------------"
          done
