name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-methurepos:
    runs-on: ubuntu-latest

    steps:

      ############################################################
      # DOWNLOAD CURRENT DATABASE
      ############################################################

      - name: Download current repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing repository database found."
          else
            echo "No existing database found."
          fi


      ############################################################
      # READ MR RELEASE
      ############################################################

      - name: Read mr release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            | grep -E '\.pkg\.tar\.zst$' \
            | sort -u \
            > release-packages.txt \
            || true

          echo
          echo "=========================================="
          echo "PACKAGES IN MR RELEASE"
          echo "=========================================="

          cat release-packages.txt || true


      ############################################################
      # CREATE ARCH DATABASE METADATA
      ############################################################

      - name: Read existing database
        run: |
          set -Eeuo pipefail

          if [ ! -f repo/methurepos.db.tar.gz ]; then

            echo "No database exists."

            : > db-packages.txt

          else

            docker run --rm -i \
              -v "$PWD:/work" \
              archlinux:latest \
              bash <<'CONTAINER'

          set -Eeuo pipefail

          cd /work

          pacman -Sy --noconfirm pacman-contrib

          rm -rf /tmp/methurepos-db
          mkdir -p /tmp/methurepos-db

          bsdtar \
            -xzf repo/methurepos.db.tar.gz \
            -C /tmp/methurepos-db

          : > db-packages.txt

          for desc in /tmp/methurepos-db/*/desc; do

            [ -f "$desc" ] || continue

            name=""
            version=""
            filename=""

            while IFS= read -r line; do

              case "$line" in

                "%NAME%")
                  read -r name
                  ;;

                "%VERSION%")
                  read -r version
                  ;;

                "%FILENAME%")
                  read -r filename
                  ;;

              esac

            done < "$desc"

            if [ -n "$name" ] && [ -n "$version" ]; then

              printf '%s\t%s\t%s\n' \
                "$name" \
                "$version" \
                "$filename" \
                >> db-packages.txt

            fi

          done

          sort -u db-packages.txt -o db-packages.txt

          echo
          echo "=========================================="
          echo "PACKAGES IN EXISTING DATABASE"
          echo "=========================================="

          cat db-packages.txt || true

          CONTAINER

          fi


      ############################################################
      # CONVERT RELEASE FILENAMES TO PACKAGE METADATA
      ############################################################

      - name: Read release package metadata
        run: |
          set -Eeuo pipefail

          : > release-metadata.txt

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash <<'CONTAINER'

          set -Eeuo pipefail

          cd /work

          pacman -Sy --noconfirm pacman-contrib

          while IFS= read -r filename; do

            [ -n "$filename" ] || continue

            echo
            echo "Reading: $filename"

            pkgname="$(
              pacman -Qp \
                --print-format '%n' \
                "$filename" \
                2>/dev/null \
                || true
            )"

            pkgver="$(
              pacman -Qp \
                --print-format '%v' \
                "$filename" \
                2>/dev/null \
                || true
            )"

            if [ -n "$pkgname" ] && [ -n "$pkgver" ]; then

              printf '%s\t%s\t%s\n' \
                "$pkgname" \
                "$pkgver" \
                "$filename" \
                >> /work/release-metadata.txt

            fi

          done < /work/release-packages.txt

          sort -u \
            /work/release-metadata.txt \
            -o /work/release-metadata.txt

          CONTAINER


          echo
          echo "=========================================="
          echo "RELEASE METADATA"
          echo "=========================================="

          cat release-metadata.txt || true


      ############################################################
      # COMPARE
      ############################################################

      - name: Compare repository and release
        run: |
          set -Eeuo pipefail

          : > packages-to-download.txt
          : > packages-to-remove.txt


          echo
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="


          ########################################################
          # RELEASE -> DATABASE
          #
          # Determine:
          #
          # NEW
          # UPDATED
          # UNCHANGED
          ########################################################

          while IFS=$'\t' read -r release_name release_version release_filename; do

            [ -n "$release_name" ] || continue

            db_line="$(
              awk -F '\t' \
                -v name="$release_name" \
                '$1 == name { print; exit }' \
                db-packages.txt
            )"


            if [ -z "$db_line" ]; then

              echo "$release_filename"
              echo "Package: $release_name"
              echo "-> NEW"

              echo "$release_filename" \
                >> packages-to-download.txt

              continue

            fi


            db_name="$(printf '%s\n' "$db_line" | cut -f1)"
            db_version="$(printf '%s\n' "$db_line" | cut -f2)"
            db_filename="$(printf '%s\n' "$db_line" | cut -f3)"


            if [ "$db_filename" = "$release_filename" ]; then

              echo "$release_filename"
              echo "Package: $release_name"
              echo "-> UNCHANGED"

            else

              echo "$release_filename"
              echo "Package: $release_name"
              echo "-> UPDATED"
              echo "Old: $db_filename"
              echo "New: $release_filename"

              echo "$release_filename" \
                >> packages-to-download.txt

              echo "$release_name" \
                >> packages-to-remove.txt

            fi

          done < release-metadata.txt


          ########################################################
          # DATABASE -> RELEASE
          #
          # Find packages that have been removed from mr.
          ########################################################

          echo
          echo "=========================================="
          echo "CHECKING DELETED PACKAGES"
          echo "=========================================="


          while IFS=$'\t' read -r db_name db_version db_filename; do

            [ -n "$db_name" ] || continue


            if ! awk -F '\t' \
              -v name="$db_name" \
              '$1 == name { found=1; exit } END { exit !found }' \
              release-metadata.txt
            then

              echo "DELETED: $db_name"

              echo "$db_name" \
                >> packages-to-remove.txt

            fi

          done < db-packages.txt


          ########################################################
          # REMOVE DUPLICATES
          ########################################################

          sort -u \
            packages-to-download.txt \
            -o packages-to-download.txt

          sort -u \
            packages-to-remove.txt \
            -o packages-to-remove.txt


          echo
          echo "=========================================="
          echo "DOWNLOAD"
          echo "=========================================="

          cat packages-to-download.txt || true


          echo
          echo "=========================================="
          echo "REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true


      ############################################################
      # DOWNLOAD ONLY NEW / UPDATED PACKAGES
      ############################################################

      - name: Download changed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r package; do

            [ -n "$package" ] || continue

            echo
            echo "Downloading: $package"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$package" \
              --dir packages \
              --clobber

          done < packages-to-download.txt


      ############################################################
      # UPDATE DATABASE
      ############################################################

      - name: Update repository database
        run: |
          set -Eeuo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash <<'CONTAINER'

          set -Eeuo pipefail

          cd /work

          pacman -Sy --noconfirm pacman-contrib


          ########################################################
          # CREATE DATABASE IF IT DOES NOT EXIST
          ########################################################

          if [ ! -f repo/methurepos.db.tar.gz ]; then

            echo "Creating new repository database."

            mkdir -p /tmp/empty-repo

            repo-add \
              /tmp/empty-repo/methurepos.db.tar.gz

            cp \
              /tmp/empty-repo/methurepos.db.tar.gz \
              repo/methurepos.db.tar.gz

          fi


          ########################################################
          # REMOVE OLD / DELETED PACKAGES
          ########################################################

          if [ -s packages-to-remove.txt ]; then

            while IFS= read -r package; do

              [ -n "$package" ] || continue

              echo
              echo "Removing from repository: $package"

              repo-remove \
                repo/methurepos.db.tar.gz \
                "$package"

            done < packages-to-remove.txt

          fi


          ########################################################
          # ADD NEW / UPDATED PACKAGES
          ########################################################

          shopt -s nullglob

          packages=(packages/*.pkg.tar.zst)

          if [ "${#packages[@]}" -gt 0 ]; then

            echo
            echo "Adding packages..."

            repo-add \
              repo/methurepos.db.tar.gz \
              "${packages[@]}"

          else

            echo "No packages need to be added."

          fi


          ########################################################
          # DATABASE SYMLINK
          ########################################################

          rm -f repo/methurepos.db

          ln -s \
            methurepos.db.tar.gz \
            repo/methurepos.db


          ########################################################
          # CLEAN OLD FILES DATABASE
          ########################################################

          rm -f \
            repo/methurepos.files \
            repo/methurepos.files.tar.gz


          ########################################################
          # CREATE FILES DATABASE
          ########################################################

          if [ "${#packages[@]}" -gt 0 ]; then

            repo-add \
              --files \
              repo/methurepos.db.tar.gz \
              "${packages[@]}" \
              || true

          fi


          ########################################################
          # FILES SYMLINK
          ########################################################

          if [ -f repo/methurepos.files.tar.gz ]; then

            rm -f repo/methurepos.files

            ln -s \
              methurepos.files.tar.gz \
              repo/methurepos.files

          fi


          echo
          echo "=========================================="
          echo "FINAL REPOSITORY"
          echo "=========================================="

          ls -lah repo/

          CONTAINER


      ############################################################
      # VERIFY
      ############################################################

      - name: Verify repository
        run: |
          set -Eeuo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash <<'CONTAINER'

          set -Eeuo pipefail

          cd /work

          mkdir -p /tmp/repo
          mkdir -p /tmp/db
          mkdir -p /tmp/cache

          cp \
            repo/methurepos.db.tar.gz \
            /tmp/repo/methurepos.db.tar.gz


          cat > /tmp/pacman.conf <<EOF
          [options]
          Architecture = x86_64
          SigLevel = Never
          DBPath = /tmp/db
          CacheDir = /tmp/cache

          [methurepos]
          SigLevel = Never
          Server = file:///tmp/repo
          EOF


          pacman \
            --config /tmp/pacman.conf \
            -Sy


          echo
          echo "=========================================="
          echo "FINAL PACMAN DATABASE"
          echo "=========================================="


          pacman \
            --config /tmp/pacman.conf \
            -Sl methurepos

          CONTAINER


      ############################################################
      # DELETE OLD DATABASE ASSETS FROM GITHUB RELEASE
      ############################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for asset in \
            methurepos.db \
            methurepos.db.tar.gz \
            methurepos.files \
            methurepos.files.tar.gz
          do

            gh release delete-asset mr \
              "$asset" \
              --repo Methusan105/archconfig \
              --yes \
              || true

          done


      ############################################################
      # UPLOAD NEW DATABASE
      ############################################################

      - name: Upload new database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db.tar.gz \
            repo/methurepos.db \
            --repo Methusan105/archconfig \
            --clobber


          if [ -f repo/methurepos.files.tar.gz ]; then

            gh release upload mr \
              repo/methurepos.files.tar.gz \
              repo/methurepos.files \
              --repo Methusan105/archconfig \
              --clobber

          fi


      ############################################################
      # SUMMARY
      ############################################################

      - name: Summary
        run: |
          echo
          echo "=========================================="
          echo "METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          echo
          echo "Downloaded:"
          cat packages-to-download.txt || true

          echo
          echo "Removed:"
          cat packages-to-remove.txt || true

          echo
          echo "Repository:"
          ls -lah repo/
