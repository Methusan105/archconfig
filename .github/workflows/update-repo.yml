name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Download current repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing database found."
          else
            echo "No existing database."
          fi


      - name: Get package list from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' |
            grep -E '\.pkg\.tar\.zst$' |
            sort -u \
            > release.txt \
            || true

          echo "=== Packages in mr ==="

          cat release.txt || true


      - name: Show current state
        run: |
          set -Eeuo pipefail

          echo ""
          echo "================================"
          echo "RELEASE PACKAGES"
          echo "================================"

          cat release.txt || true

          echo ""
          echo "Count:"
          wc -l release.txt


      #################################################
      # DOWNLOAD ALL RELEASE PACKAGES TEMPORARILY
      #
      # This is intentionally only used for comparison.
      # Packages that are already in the database don't
      # need to be re-added.
      #################################################

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p packages

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Downloading $pkg"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$pkg" \
              --dir packages \
              --clobber

          done < release.txt


      #################################################
      # REBUILD DATABASE
      #################################################

      - name: Build repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm pacman-contrib


              #################################################
              # CREATE FRESH DATABASE
              #################################################

              rm -f repo/methurepos.db.tar.gz
              rm -f repo/methurepos.db


              #################################################
              # ADD EVERY PACKAGE CURRENTLY IN MR
              #################################################

              packages=()

              for pkg in packages/*.pkg.tar.zst; do

                [ -f "$pkg" ] || continue

                packages+=("$pkg")

              done


              if [ "${#packages[@]}" -eq 0 ]; then

                echo "ERROR: mr contains no packages."

                exit 1

              fi


              echo ""
              echo "Adding ${#packages[@]} packages."


              repo-add \
                repo/methurepos.db.tar.gz \
                "${packages[@]}"


              #################################################
              # CREATE DB COPY
              #################################################
              
              rm -f repo/methurepos.db
              
              cp \
                repo/methurepos.db.tar.gz \
                repo/methurepos.db
              
              
              #################################################
              # SHOW RESULT
              #################################################
              
              echo ""
              echo "================================"
              echo "FINAL DATABASE"
              echo "================================"
              
              ls -lh \
                repo/methurepos.db \
                repo/methurepos.db.tar.gz


      #################################################
      # REPLACE DATABASE ON RELEASE
      #################################################

      - name: Replace repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true

          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


      #################################################
      # SUMMARY
      #################################################

      - name: Summary
        run: |
          echo ""
          echo "=============================================="
          echo "        METHUREPOS UPDATED"
          echo "=============================================="
          echo ""

          echo "Packages in mr:"
          cat release.txt

          echo ""
          echo "Repository database:"
          ls -lh repo/methurepos.db* || true

          echo ""
          echo "Done."
