name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # DOWNLOAD CURRENT DATABASE
      #################################################

      - name: Download current database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber || true

          echo "=== Existing database ==="
          ls -lah repo


      #################################################
      # GET RELEASE PACKAGES
      #################################################

      - name: Get packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' |
            grep -E '\.pkg\.tar\.zst$' |
            sort -u \
            > release-packages.txt || true

          echo "=== Packages in mr ==="

          cat release-packages.txt || true


      #################################################
      # EXTRACT DATABASE METADATA
      #################################################

      - name: Extract database package metadata
        run: |
          set -Eeuo pipefail

          : > db-packages.txt

          if [ -f repo/methurepos.db.tar.gz ]; then

            tar -xOf repo/methurepos.db.tar.gz \
              --wildcards '*/desc' 2>/dev/null |
            awk '
              /^%NAME%$/ {
                getline name
              }

              /^%VERSION%$/ {
                getline version
              }

              /^%FILENAME%$/ {
                getline filename

                if (name != "" && version != "" && filename != "") {
                  print name "|" version "|" filename
                }

                name=""
                version=""
                filename=""
              }
            ' |
            sort -u > db-packages.txt

          fi

          echo "=== Packages in DB ==="

          cat db-packages.txt || true


      #################################################
      # EXTRACT RELEASE PACKAGE METADATA
      #################################################

      - name: Download metadata for comparison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          : > release-metadata.txt

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "$pkg"

          done < release-packages.txt

          echo ""
          echo "Release package count:"
          wc -l release-packages.txt


      #################################################
      # DETERMINE ADD / REMOVE
      #################################################

      - name: Determine repository changes
        run: |
          set -Eeuo pipefail

          : > packages-to-add.txt
          : > packages-to-remove.txt

          #################################################
          # PACKAGES CURRENTLY IN DB
          #################################################

          cut -d'|' -f3 db-packages.txt |
            sort -u \
            > db-filenames.txt


          #################################################
          # PACKAGES CURRENTLY IN RELEASE
          #################################################

          cp release-packages.txt release-filenames.txt


          #################################################
          # EXACT SAME FILE = UNCHANGED
          #################################################

          comm -12 \
            db-filenames.txt \
            release-filenames.txt \
            > unchanged.txt


          #################################################
          # RELEASE ONLY = NEW
          #################################################

          comm -13 \
            db-filenames.txt \
            release-filenames.txt \
            > packages-to-add.txt


          #################################################
          # DB ONLY = DELETED
          #################################################

          comm -23 \
            db-filenames.txt \
            release-filenames.txt \
            > packages-to-remove.txt


          echo ""
          echo "================================"
          echo "UNCHANGED"
          echo "================================"

          cat unchanged.txt || true


          echo ""
          echo "================================"
          echo "TO ADD"
          echo "================================"

          cat packages-to-add.txt || true


          echo ""
          echo "================================"
          echo "TO REMOVE"
          echo "================================"

          cat packages-to-remove.txt || true


      #################################################
      # DOWNLOAD NEW PACKAGES
      #################################################

      - name: Download new packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Downloading: $pkg"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$pkg" \
              --dir repo \
              --clobber

          done < packages-to-add.txt


      #################################################
      # UPDATE DATABASE
      #################################################

      - name: Update repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work/repo

              pacman -Sy --noconfirm pacman-contrib


              #################################################
              # CREATE DATABASE
              #################################################

              if [ ! -f methurepos.db.tar.gz ]; then

                echo "Creating new repository."

                packages=()

                for pkg in ./*.pkg.tar.zst; do

                  [ -f "$pkg" ] || continue

                  packages+=("$pkg")

                done

                if [ "${#packages[@]}" -eq 0 ]; then

                  echo "ERROR: No packages available."
                  exit 1

                fi

                repo-add \
                  methurepos.db.tar.gz \
                  "${packages[@]}"

              fi


              #################################################
              # REMOVE DELETED PACKAGES
              #################################################

              echo ""
              echo "=== Removing deleted packages ==="

              while IFS= read -r filename; do

                [ -z "$filename" ] && continue

                echo "Removing: $filename"


                #################################################
                # Find package NAME in database
                #################################################

                pkgname="$(
                  tar -xOf methurepos.db.tar.gz \
                    --wildcards "*/desc" 2>/dev/null |
                  awk -v target="$filename" '
                    BEGIN {
                      name=""
                      file=""
                    }

                    /^%NAME%$/ {
                      getline name
                    }

                    /^%FILENAME%$/ {
                      getline file

                      if (file == target) {
                        print name
                        exit
                      }
                    }
                  '
                )"


                if [ -n "$pkgname" ]; then

                  echo "Package name: $pkgname"

                  repo-remove \
                    methurepos.db.tar.gz \
                    "$pkgname"

                else

                  echo "WARNING: Package not found: $filename"

                fi

              done < /work/packages-to-remove.txt


              #################################################
              # ADD NEW PACKAGES
              #################################################

              echo ""
              echo "=== Adding packages ==="

              while IFS= read -r filename; do

                [ -z "$filename" ] && continue

                if [ ! -f "$filename" ]; then

                  echo "ERROR: Missing package:"
                  echo "$filename"

                  exit 1

                fi

                echo "Adding: $filename"

                repo-add \
                  methurepos.db.tar.gz \
                  "$filename"

              done < /work/packages-to-add.txt


              #################################################
              # FINAL
              #################################################

              echo ""
              echo "=== Final database ==="

              tar -tzf methurepos.db.tar.gz | head

              echo ""
              ls -lh methurepos.db.tar.gz

            '


      #################################################
      # PREPARE DB
      #################################################

      - name: Prepare database assets
        run: |
          set -Eeuo pipefail

          cd repo

          rm -f methurepos.db

          cp -L \
            methurepos.db.tar.gz \
            methurepos.db

          echo "=== Database ==="

          ls -lh \
            methurepos.db \
            methurepos.db.tar.gz


      #################################################
      # DELETE OLD DB ASSETS
      #################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true

          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      #################################################
      # UPLOAD NEW DB
      #################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


      #################################################
      # REMOVE DELETED PACKAGE ASSETS
      #################################################

      - name: Remove deleted packages from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Deleting release asset: $pkg"

            gh release delete-asset mr \
              "$pkg" \
              --repo Methusan105/archconfig \
              --yes \
              || true

          done < packages-to-remove.txt


      #################################################
      # UPLOAD NEW PACKAGES
      #################################################

      - name: Upload new packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Uploading: $pkg"

            gh release upload mr \
              "repo/$pkg" \
              --repo Methusan105/archconfig \
              --clobber

          done < packages-to-add.txt


      #################################################
      # SUMMARY
      #################################################

      - name: Summary
        run: |
          echo ""
          echo "=============================================="
          echo "       METHUREPOS UPDATE COMPLETE"
          echo "=============================================="
          echo ""

          echo "Added:"
          cat packages-to-add.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true

          echo ""
          echo "Unchanged:"
          cat unchanged.txt || true

          echo ""
