name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # DOWNLOAD EXISTING DATABASE
      #################################################

      - name: Download existing MethuRepo database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber || true

          echo "=== Existing database ==="
          ls -lah repo


      #################################################
      # GET ALL PACKAGE ASSETS FROM MR
      #################################################

      - name: Get packages from mr release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' |
            grep '\.pkg\.tar\.zst$' |
            sort |
            uniq \
            > release-packages.txt

          echo "=== Packages in mr ==="
          cat release-packages.txt


      #################################################
      # READ PACKAGES FROM DATABASE
      #################################################

      - name: Read packages from database
        run: |
          set -Eeuo pipefail

          touch db-packages.txt

          if [ -f repo/methurepos.db.tar.gz ]; then

            tar -xOf repo/methurepos.db.tar.gz \
              --wildcards '*/desc' 2>/dev/null |
              awk '
                /^%FILENAME%$/ {
                    getline
                    print
                }
              ' |
              sort |
              uniq \
              > db-packages.txt

          fi

          echo "=== Packages in methurepos database ==="
          cat db-packages.txt || true


      #################################################
      # COMPARE DB AND RELEASE
      #################################################

      - name: Compare repository with release
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo " COMPARING METHUREPOS DB WITH MR RELEASE"
          echo "=========================================="
          echo ""

          echo "=== DB ONLY ==="
          comm -23 db-packages.txt release-packages.txt || true

          echo ""
          echo "=== RELEASE ONLY ==="
          comm -13 db-packages.txt release-packages.txt || true

          echo ""
          echo "=== SAME ==="
          comm -12 db-packages.txt release-packages.txt || true


      #################################################
      # FIND PACKAGE NAME
      #################################################

      - name: Determine changes
        run: |
          set -Eeuo pipefail

          touch packages-to-add.txt
          touch packages-to-remove.txt
          touch packages-to-download.txt

          #################################################
          # EXACT FILENAME COMPARISON
          #################################################

          comm -13 \
            db-packages.txt \
            release-packages.txt \
            > packages-to-add.txt

          comm -23 \
            db-packages.txt \
            release-packages.txt \
            > packages-to-remove.txt


          #################################################
          # DETECT REPLACED VERSIONS
          #################################################

          echo "=== Checking replaced package versions ==="

          while IFS= read -r oldpkg; do

            [ -z "$oldpkg" ] && continue

            oldname="$(
              echo "$oldpkg" |
              sed -E \
                's/-([0-9][^-]*)-[0-9]+-x86_64\.pkg\.tar\.zst$//'
            )"

            while IFS= read -r newpkg; do

              [ -z "$newpkg" ] && continue

              newname="$(
                echo "$newpkg" |
                sed -E \
                  's/-([0-9][^-]*)-[0-9]+-x86_64\.pkg\.tar\.zst$//'
              )"

              if [ "$oldname" = "$newname" ]; then

                echo "REPLACED:"
                echo "  OLD: $oldpkg"
                echo "  NEW: $newpkg"

                echo "$oldpkg" >> packages-to-remove.txt
                echo "$newpkg" >> packages-to-add.txt

              fi

            done < release-packages.txt

          done < packages-to-remove.txt


          sort -u packages-to-add.txt \
            -o packages-to-add.txt

          sort -u packages-to-remove.txt \
            -o packages-to-remove.txt


          #################################################
          # DISPLAY
          #################################################

          echo ""
          echo "=========================================="
          echo " PACKAGES TO REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true

          echo ""
          echo "=========================================="
          echo " PACKAGES TO ADD"
          echo "=========================================="

          cat packages-to-add.txt || true


      #################################################
      # DOWNLOAD ONLY PACKAGES THAT ARE NEW
      #################################################

      - name: Download packages to add
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "=== Downloading required packages ==="

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Downloading: $pkg"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$pkg" \
              --dir repo \
              --clobber

          done < packages-to-add.txt


      #################################################
      # UPDATE DATABASE
      #################################################

      - name: Update database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work/repo

              pacman -Sy --noconfirm pacman-contrib


              #################################################
              # CREATE DATABASE IF NEEDED
              #################################################

              if [ ! -f methurepos.db.tar.gz ]; then

                echo "Creating new repository database."

                first_pkg=""

                for pkg in ./*.pkg.tar.zst; do
                  if [ -f "$pkg" ]; then
                    first_pkg="$pkg"
                    break
                  fi
                done

                if [ -n "$first_pkg" ]; then

                  repo-add \
                    methurepos.db.tar.gz \
                    "$first_pkg"

                else

                  echo "ERROR: No packages available."
                  exit 1

                fi

              fi


              #################################################
              # REMOVE PACKAGES
              #################################################

              echo ""
              echo "=== Removing packages ==="

              while IFS= read -r pkg; do

                [ -z "$pkg" ] && continue

                echo "Removing: $pkg"

                # Find the package name from the DB.
                pkgname="$(
                  tar -xOf methurepos.db.tar.gz \
                    --wildcards "*/desc" 2>/dev/null |
                  awk -v target="$pkg" '
                    /^%FILENAME%$/ {
                      getline filename

                      if (filename == target) {
                        found=1
                      }

                      next
                    }

                    found && /^%NAME%$/ {
                      getline
                      print
                      exit
                    }
                  '
                )"

                if [ -n "$pkgname" ]; then

                  echo "Package name: $pkgname"

                  repo-remove \
                    methurepos.db.tar.gz \
                    "$pkgname"

                else

                  echo "WARNING: Could not find $pkg"

                fi

              done < /work/packages-to-remove.txt


              #################################################
              # ADD PACKAGES
              #################################################

              echo ""
              echo "=== Adding packages ==="

              while IFS= read -r pkg; do

                [ -z "$pkg" ] && continue

                if [ -f "$pkg" ]; then

                  echo "Adding: $pkg"

                  repo-add \
                    methurepos.db.tar.gz \
                    "$pkg"

                else

                  echo "ERROR: Missing package $pkg"
                  exit 1

                fi

              done < /work/packages-to-add.txt


              #################################################
              # COMPLETE
              #################################################

              echo ""
              echo "=== Final database ==="

              ls -lah methurepos.db.tar.gz

            '


      #################################################
      # CREATE DB ASSET
      #################################################

      - name: Prepare database
        run: |
          set -Eeuo pipefail

          cd repo

          rm -f methurepos.db

          cp -L \
            methurepos.db.tar.gz \
            methurepos.db

          echo "=== Database ==="
          ls -lah methurepos.db*


      #################################################
      # REMOVE OLD DB FROM RELEASE
      #################################################

      - name: Replace database on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true

          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      #################################################
      # UPLOAD DATABASE
      #################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


      #################################################
      # REMOVE DELETED PACKAGE ASSETS
      #################################################

      - name: Remove deleted package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "=== Removing packages no longer in mr ==="

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Deleting release asset: $pkg"

            gh release delete-asset mr \
              "$pkg" \
              --repo Methusan105/archconfig \
              --yes \
              || true

          done < packages-to-remove.txt


      #################################################
      # UPLOAD NEW PACKAGES
      #################################################

      - name: Upload new packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "=== Uploading new packages ==="

          while IFS= read -r pkg; do

            [ -z "$pkg" ] && continue

            echo "Uploading: $pkg"

            gh release upload mr \
              "repo/$pkg" \
              --repo Methusan105/archconfig \
              --clobber

          done < packages-to-add.txt


      #################################################
      # SUMMARY
      #################################################

      - name: Summary
        run: |
          echo ""
          echo "=============================================="
          echo "       METHUREPOS UPDATE COMPLETE"
          echo "=============================================="
          echo ""

          echo "Added:"
          cat packages-to-add.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true

          echo ""
          echo "Unchanged:"
          comm -12 \
            db-packages.txt \
            release-packages.txt \
            || true

          echo ""
          echo "=============================================="
