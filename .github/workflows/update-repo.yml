name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # GET CURRENT DATABASE FROM MR
      #################################################

      - name: Download current repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing MethuRepo database found."
          else
            echo "No existing database found."
          fi


      #################################################
      # GET PACKAGE FILENAMES FROM MR
      #################################################

      - name: Get release package list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' |
            grep -E '\.pkg\.tar\.zst$' |
            sort -u \
            > release-files.txt \
            || true

          echo "=========================================="
          echo "Packages in mr"
          echo "=========================================="

          cat release-files.txt || true


      #################################################
      # CREATE ARCH WORKSPACE
      #################################################

      - name: Create Arch workspace
        run: |
          set -Eeuo pipefail

          mkdir -p arch-work


      #################################################
      # INITIALIZE PACMAN DATABASE
      #################################################

      - name: Inspect existing repository with pacman
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm


              #################################################
              # CREATE TEMP PACMAN CONFIG
              #################################################

              cat > /tmp/pacman.conf <<EOF
              [options]
              Architecture = auto
              SigLevel = Never
              CacheDir = /tmp/cache
              DBPath = /tmp/pacman-db
              EOF


              mkdir -p /tmp/cache
              mkdir -p /tmp/pacman-db


              #################################################
              # REGISTER LOCAL METHUREPOS DATABASE
              #################################################

              if [ -f repo/methurepos.db.tar.gz ]; then

                mkdir -p /tmp/localrepo

                cp \
                  repo/methurepos.db.tar.gz \
                  /tmp/localrepo/methurepos.db.tar.gz


                cat >> /tmp/pacman.conf <<EOF

              [methurepos]
              SigLevel = Never
              Server = file:///tmp/localrepo
              EOF


                echo ""
                echo "=========================================="
                echo "Packages currently in MethuRepo"
                echo "=========================================="


                pacman \
                  --config /tmp/pacman.conf \
                  -Sy


                pacman \
                  --config /tmp/pacman.conf \
                  -Sl methurepos \
                  > /work/db-packages.txt


                cat /work/db-packages.txt

              else

                echo "No existing database."

                : > /work/db-packages.txt

              fi

            '


      #################################################
      # PARSE RELEASE NAMES WITHOUT DOWNLOADING
      #################################################

      - name: Compare release with repository
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="


          : > packages-to-add.txt
          : > packages-to-remove.txt


          #################################################
          # PACMAN -SL FORMAT:
          #
          # methurepos package version
          #################################################

          awk '
            NF >= 3 {
              print $2 "\t" $3
            }
          ' db-packages.txt |
          sort -u \
          > db-package-versions.txt


          echo ""
          echo "=== Current database ==="

          cat db-package-versions.txt || true


          #################################################
          # GET PACKAGE NAME/VERSION FROM FILENAMES
          #
          # Arch package filenames:
          #
          # name-version-arch.pkg.tar.zst
          #################################################

          : > release-package-versions.txt


          while IFS= read -r filename; do

            [ -z "$filename" ] && continue


            base="${filename%.pkg.tar.zst}"


            # Remove architecture.
            base="${base%-x86_64}"


            # Remove pkgrel.
            base="${base%-*}"


            # Everything before the final version/pkgrel
            # is the package name.
            #
            # This is only used for comparison. The actual
            # package is downloaded later and repo-add reads
            # the authoritative metadata.


            name="$(
              printf '%s\n' "$base" |
              sed -E 's/-[0-9]+(\.[0-9]+)*([+._:-][^-]*)?$//'
            )"


            # For exact comparison, use the filename itself.
            printf '%s\t%s\n' \
              "$filename" \
              "$name" \
              >> release-package-versions.txt

          done < release-files.txt


          #################################################
          # SIMPLE FILENAME COMPARISON
          #
          # DB package filenames can be obtained from pacman
          # by asking for detailed package information.
          #################################################


          : > db-files.txt


          while read -r repo name version; do

            [ -z "$name" ] && continue

            printf '%s\t%s\n' \
              "$name" \
              "$version" \
              >> db-files.txt

          done < db-packages.txt


          #################################################
          # MATCH RELEASE PACKAGES AGAINST DB BY NAME
          #################################################

          while IFS= read -r filename; do

            [ -z "$filename" ] && continue


            echo ""
            echo "Checking:"
            echo "$filename"


            #################################################
            # DOWNLOAD PACKAGE HEADER ONLY
            #
            # We do this later only for packages that might
            # be new/changed.
            #################################################


            # Find an existing package with the same name
            # by looking at its filename.
            existing="$(
              grep -F -- "$filename" db-files.txt \
              || true
            )"


            if [ -n "$existing" ]; then

              echo "UNCHANGED:"
              echo "$filename"

            else

              echo "NEW OR UPDATED:"
              echo "$filename"

              printf '%s\n' \
                "$filename" \
                >> packages-to-add.txt

            fi

          done < release-files.txt


          #################################################
          # PACKAGES IN DB BUT NOT RELEASE
          #################################################

          echo ""
          echo "=========================================="
          echo "Checking for deleted packages"
          echo "=========================================="


          while read -r repo name version; do

            [ -z "$name" ] && continue


            found=false


            while IFS= read -r filename; do

              [ -z "$filename" ] && continue


              case "$filename" in
                "$name"-*)
                  found=true
                  break
                  ;;
              esac

            done < release-files.txt


            if [ "$found" = false ]; then

              echo "REMOVED FROM RELEASE:"
              echo "$name $version"

              printf '%s\n' \
                "$name" \
                >> packages-to-remove.txt

            fi

          done < db-packages.txt


          sort -u \
            packages-to-add.txt \
            -o packages-to-add.txt


          sort -u \
            packages-to-remove.txt \
            -o packages-to-remove.txt


          echo ""
          echo "=========================================="
          echo "TO ADD"
          echo "=========================================="

          cat packages-to-add.txt || true


          echo ""
          echo "=========================================="
          echo "TO REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true


      #################################################
      # DOWNLOAD ONLY NEW/UPDATED PACKAGES
      #################################################

      - name: Download changed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r filename; do

            [ -z "$filename" ] && continue

            echo ""
            echo "Downloading:"
            echo "$filename"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$filename" \
              --dir packages \
              --clobber

          done < packages-to-add.txt


      #################################################
      # UPDATE REPOSITORY WITH ARCH TOOLS
      #################################################

      - name: Update repository
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm pacman-contrib


              #################################################
              # REMOVE DELETED PACKAGES
              #################################################

              echo ""
              echo "=========================================="
              echo "Removing deleted packages"
              echo "=========================================="


              if [ -f repo/methurepos.db.tar.gz ]; then

                while IFS= read -r package; do

                  [ -z "$package" ] && continue

                  echo "Removing:"
                  echo "$package"


                  repo-remove \
                    repo/methurepos.db.tar.gz \
                    "$package"

                done < packages-to-remove.txt

              fi


              #################################################
              # REMOVE OLD VERSIONS
              #################################################

              echo ""
              echo "=========================================="
              echo "Checking replaced packages"
              echo "=========================================="


              if [ -f repo/methurepos.db.tar.gz ]; then

                while IFS= read -r pkgfile; do

                  [ -z "$pkgfile" ] && continue


                  pkgname="$(
                    pacman \
                      --noconfirm \
                      -Qp \
                      --print-format "%n" \
                      "packages/$pkgfile"
                  )"


                  if pacman \
                    --config /tmp/pacman.conf \
                    -Q "$pkgname" \
                    >/dev/null 2>&1
                  then

                    echo "Replacing existing package:"
                    echo "$pkgname"

                    repo-remove \
                      repo/methurepos.db.tar.gz \
                      "$pkgname"

                  fi

                done < packages-to-add.txt

              fi


              #################################################
              # ADD NEW PACKAGES
              #################################################

              echo ""
              echo "=========================================="
              echo "Adding packages"
              echo "=========================================="


              while IFS= read -r pkgfile; do

                [ -z "$pkgfile" ] && continue

                echo "Adding:"
                echo "$pkgfile"


                repo-add \
                  repo/methurepos.db.tar.gz \
                  "packages/$pkgfile"

              done < packages-to-add.txt


              #################################################
              # CREATE methurepos.db
              #################################################

              if [ -f repo/methurepos.db.tar.gz ]; then

                rm -f repo/methurepos.db

                cp \
                  repo/methurepos.db.tar.gz \
                  repo/methurepos.db

              fi


              echo ""
              echo "=========================================="
              echo "Final repository"
              echo "=========================================="

              ls -lah repo/

            '


      #################################################
      # VERIFY
      #################################################

      - name: Verify repository
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "FINAL REPOSITORY"
          echo "=========================================="

          ls -lah repo/

          if [ -f repo/methurepos.db.tar.gz ]; then

            echo ""
            echo "Database contents:"

            tar -tzf repo/methurepos.db.tar.gz

          fi


      #################################################
      # DELETE OLD DATABASE ASSETS
      #################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true

          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      #################################################
      # UPLOAD UPDATED DATABASE
      #################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -f repo/methurepos.db.tar.gz ]; then

            gh release upload mr \
              repo/methurepos.db \
              repo/methurepos.db.tar.gz \
              --repo Methusan105/archconfig \
              --clobber

          else

            echo "No database was generated."

          fi


      #################################################
      # SUMMARY
      #################################################

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "       METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          echo ""
          echo "Added / updated:"
          cat packages-to-add.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true
