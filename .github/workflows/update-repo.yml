name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      ############################################################
      # DOWNLOAD CURRENT DATABASE
      ############################################################

      - name: Download current database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
              echo "Existing repository database found."
          else
              echo "No existing repository database."
          fi


      ############################################################
      # GET RELEASE PACKAGE LIST
      ############################################################

      - name: Read mr release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            | grep -E '\.pkg\.tar\.zst$' \
            | sort -u \
            > release-packages.txt \
            || true

          echo ""
          echo "=========================================="
          echo "Packages in mr"
          echo "=========================================="

          cat release-packages.txt || true


      ############################################################
      # INSTALL ARCH TOOLS
      ############################################################

      - name: Prepare Arch container
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              pacman -Sy --noconfirm pacman-contrib


              ####################################################
              # PREPARE DIRECTORY
              ####################################################

              cd /work

              mkdir -p repo packages


              ####################################################
              # CREATE EMPTY DATABASE IF NEEDED
              ####################################################

              if [ ! -f repo/methurepos.db.tar.gz ]; then

                  echo "Creating new repository database."

                  repo-add \
                    repo/methurepos.db.tar.gz

              fi


              ####################################################
              # READ CURRENT DB WITH PACMAN
              ####################################################

              echo ""
              echo "=========================================="
              echo "Current MethuRepo"
              echo "=========================================="


              mkdir -p /tmp/methurepos


              cp \
                repo/methurepos.db.tar.gz \
                /tmp/methurepos/methurepos.db.tar.gz


              ####################################################
              # TEMP PACMAN CONFIG
              ####################################################

              cat > /tmp/pacman.conf <<EOF
              [options]
              Architecture = x86_64
              SigLevel = Never
              DBPath = /tmp/pacmandb
              CacheDir = /tmp/cache

              [methurepos]
              SigLevel = Never
              Server = file:///tmp/methurepos
              EOF


              mkdir -p /tmp/pacmandb
              mkdir -p /tmp/cache


              pacman \
                --config /tmp/pacman.conf \
                -Sy


              ####################################################
              # LIST DB PACKAGES
              ####################################################

              pacman \
                --config /tmp/pacman.conf \
                -Sl methurepos \
                > /work/db-packages.txt


              cat /work/db-packages.txt

            '


      ############################################################
      # COMPARE DATABASE WITH RELEASE
      ############################################################

      - name: Compare repository and release
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="


          : > packages-to-download.txt
          : > packages-to-remove.txt


          ########################################################
          # CREATE RELEASE PACKAGE MAP
          ########################################################

          declare -A RELEASE


          while IFS= read -r file; do

              [ -z "$file" ] && continue

              RELEASE["$file"]=1

          done < release-packages.txt


          ########################################################
          # CREATE DB PACKAGE MAP
          ########################################################

          declare -A DB


          if [ -f db-packages.txt ]; then

              while read -r repo name version; do

                  [ -z "${name:-}" ] && continue

                  DB["$name"]="$version"

              done < db-packages.txt

          fi


          ########################################################
          # DOWNLOAD RELEASE METADATA
          ########################################################

          while IFS= read -r file; do

              [ -z "$file" ] && continue


              ####################################################
              # PARSE PACKAGE NAME FROM ARCH FILENAME
              ####################################################

              package="$file"

              package="${package%.pkg.tar.zst}"

              package="${package%-x86_64}"


              # Remove version/pkgrel.
              #
              # This handles normal Arch package names such as:
              #
              # stremio-4.4.183-1
              # mystiq-25.04.17+1513-1
              # frame-0.33.0-1
              #
              # The authoritative metadata is checked later
              # with pacman -Qp.

              name="$(
                  printf '%s\n' "$package" |
                  sed -E 's/-[0-9][^-]*-[0-9]+$//'
              )"


              echo ""
              echo "Checking: $file"
              echo "Package:  $name"


              ####################################################
              # IF PACKAGE DOESN'T EXIST IN DB
              ####################################################

              if [ -z "${DB[$name]+x}" ]; then

                  echo "-> NEW"

                  echo "$file" >> packages-to-download.txt

                  continue

              fi


              ####################################################
              # GET RELEASE VERSION
              ####################################################

              release_version="$(
                  printf '%s\n' "$package" |
                  sed -E "s/^${name}-//"
              )"


              db_version="${DB[$name]}"


              echo "DB:      $db_version"
              echo "Release: $release_version"


              ####################################################
              # COMPARE
              ####################################################

              if [ "$release_version" != "$db_version" ]; then

                  echo "-> UPDATED"

                  echo "$file" >> packages-to-download.txt

                  echo "$name" >> packages-to-remove.txt

              else

                  echo "-> UNCHANGED"

              fi

          done < release-packages.txt


          ########################################################
          # FIND DELETED PACKAGES
          ########################################################

          echo ""
          echo "=========================================="
          echo "Checking deleted packages"
          echo "=========================================="


          for name in "${!DB[@]}"; do

              found=false


              while IFS= read -r file; do

                  [ -z "$file" ] && continue


                  package="${file%.pkg.tar.zst}"
                  package="${package%-x86_64}"


                  candidate="$(
                      printf '%s\n' "$package" |
                      sed -E 's/-[0-9][^-]*-[0-9]+$//'
                  )"


                  if [ "$candidate" = "$name" ]; then

                      found=true
                      break

                  fi

              done < release-packages.txt


              if [ "$found" = false ]; then

                  echo "-> DELETE: $name"

                  echo "$name" >> packages-to-remove.txt

              fi

          done


          ########################################################
          # REMOVE DUPLICATES
          ########################################################

          sort -u \
            packages-to-download.txt \
            -o packages-to-download.txt


          sort -u \
            packages-to-remove.txt \
            -o packages-to-remove.txt


          ########################################################
          # SUMMARY
          ########################################################

          echo ""
          echo "=========================================="
          echo "DOWNLOAD"
          echo "=========================================="

          cat packages-to-download.txt || true


          echo ""
          echo "=========================================="
          echo "REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true


      ############################################################
      # DOWNLOAD ONLY CHANGED PACKAGES
      ############################################################

      - name: Download changed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r file; do

              [ -z "$file" ] && continue

              echo ""
              echo "Downloading:"
              echo "$file"

              gh release download mr \
                --repo Methusan105/archconfig \
                --pattern "$file" \
                --dir packages \
                --clobber

          done < packages-to-download.txt


      ############################################################
      # MODIFY REPOSITORY
      ############################################################

      - name: Update repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm pacman-contrib


              ####################################################
              # REMOVE PACKAGES
              ####################################################

              echo ""
              echo "=========================================="
              echo "Removing packages"
              echo "=========================================="


              if [ -f repo/methurepos.db.tar.gz ]; then

                  while IFS= read -r name; do

                      [ -z "$name" ] && continue

                      echo "Removing: $name"

                      repo-remove \
                        repo/methurepos.db.tar.gz \
                        "$name"

                  done < packages-to-remove.txt

              fi


              ####################################################
              # ADD NEW / UPDATED PACKAGES
              ####################################################

              echo ""
              echo "=========================================="
              echo "Adding packages"
              echo "=========================================="


              for package in packages/*.pkg.tar.zst; do

                  [ -f "$package" ] || continue

                  echo "Adding:"
                  echo "$package"


                  repo-add \
                    repo/methurepos.db.tar.gz \
                    "$package"

              done


              ####################################################
              # RECREATE DB SYMLINK
              ####################################################

              rm -f repo/methurepos.db

              ln -s \
                methurepos.db.tar.gz \
                repo/methurepos.db


              ####################################################
              # RECREATE FILES DATABASE
              ####################################################

              if [ -f repo/methurepos.files.tar.gz ]; then

                  rm -f \
                    repo/methurepos.files \
                    repo/methurepos.files.tar.gz

              fi


              # repo-add already handles the files database when
              # the repository is maintained with the normal
              # Arch tooling.


              echo ""
              echo "=========================================="
              echo "Repository complete"
              echo "=========================================="


              ls -lah repo/

            '


      ############################################################
      # VERIFY
      ############################################################

      - name: Verify repository
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "FINAL DATABASE"
          echo "=========================================="


          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work


              mkdir -p /tmp/repo
              mkdir -p /tmp/db
              mkdir -p /tmp/cache


              cp \
                repo/methurepos.db.tar.gz \
                /tmp/repo/


              cat > /tmp/pacman.conf <<EOF
              [options]
              Architecture = x86_64
              SigLevel = Never
              DBPath = /tmp/db
              CacheDir = /tmp/cache

              [methurepos]
              SigLevel = Never
              Server = file:///tmp/repo
              EOF


              pacman \
                --config /tmp/pacman.conf \
                -Sy


              pacman \
                --config /tmp/pacman.conf \
                -Sl methurepos

            '


      ############################################################
      # DELETE OLD DB ASSETS
      ############################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      ############################################################
      # UPLOAD NEW DATABASE
      ############################################################

      - name: Upload new database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


          gh release upload mr \
            repo/methurepos.db \
            --repo Methusan105/archconfig \
            --clobber


      ############################################################
      # COMPLETE
      ############################################################

      - name: Complete
        run: |
          echo ""
          echo "=========================================="
          echo "METHUREPOS UPDATED"
          echo "=========================================="

          echo ""
          echo "Added / updated:"
          cat packages-to-download.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true
