name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # GET EXISTING DATABASE
      #################################################

      - name: Download existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing database found."
          else
            echo "No existing database."
            touch repo/EMPTY_DATABASE
          fi


      #################################################
      # GET RELEASE PACKAGE LIST
      #################################################

      - name: Get packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' |
            grep -E '\.pkg\.tar\.zst$' |
            sort -u \
            > release-files.txt || true

          echo "=== Packages in mr ==="

          cat release-files.txt || true


      #################################################
      # EXTRACT DB
      #################################################

      - name: Extract existing database
        run: |
          set -Eeuo pipefail

          mkdir -p db

          if [ -f repo/methurepos.db.tar.gz ]; then
            tar -xzf repo/methurepos.db.tar.gz -C db
          fi


      #################################################
      # CREATE DB PACKAGE LIST
      #################################################

      - name: Read packages from database
        run: |
          set -Eeuo pipefail

          : > db-packages.txt

          if [ -d db ]; then

            find db \
              -name desc \
              -type f \
              -print0 |
            while IFS= read -r -d '' desc; do

              name="$(
                awk '
                  /^%NAME%$/ {
                    getline
                    print
                    exit
                  }
                ' "$desc"
              )"

              version="$(
                awk '
                  /^%VERSION%$/ {
                    getline
                    print
                    exit
                  }
                ' "$desc"
              )"

              filename="$(
                awk '
                  /^%FILENAME%$/ {
                    getline
                    print
                    exit
                  }
                ' "$desc"
              )"

              if [ -n "$name" ] && [ -n "$version" ] && [ -n "$filename" ]; then
                printf '%s\t%s\t%s\n' \
                  "$name" \
                  "$version" \
                  "$filename"
              fi

            done |
            sort -u \
            > db-packages.txt

          fi

          echo ""
          echo "=== Packages currently in DB ==="

          cat db-packages.txt || true


      #################################################
      # READ RELEASE PACKAGE METADATA
      #################################################

      - name: Determine release package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          : > release-packages.txt

          mkdir -p packages

          echo "=== Reading release packages ==="

          while IFS= read -r filename; do

            [ -z "$filename" ] && continue

            name="$(
              printf '%s\n' "$filename" |
              sed -E 's/-([0-9]+:)?[0-9][^-]*(-[^-]+)?-[0-9]+-x86_64\.pkg\.tar\.zst$//'
            )"

            # Download temporarily ONLY to get authoritative
            # Arch package metadata.
            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$filename" \
              --dir packages \
              --clobber

            version="$(
              pacman -Qp \
                --print-format '%v' \
                "packages/$filename"
            )"

            real_name="$(
              pacman -Qp \
                --print-format '%n' \
                "packages/$filename"
            )"

            printf '%s\t%s\t%s\n' \
              "$real_name" \
              "$version" \
              "$filename" \
              >> release-packages.txt

          done < release-files.txt

          sort -u \
            release-packages.txt \
            -o release-packages.txt

          echo ""
          echo "=== Packages in release ==="

          cat release-packages.txt


      #################################################
      # COMPARE DB WITH RELEASE
      #################################################

      - name: Compare database with release
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "COMPARING DATABASE WITH RELEASE"
          echo "=========================================="

          : > packages-to-add.txt
          : > packages-to-remove.txt


          #################################################
          # RELEASE PACKAGES
          #################################################

          while IFS=$'\t' read -r name version filename; do

            [ -z "$name" ] && continue

            db_line="$(
              awk -F '\t' \
                -v n="$name" \
                '$1 == n {print; exit}' \
                db-packages.txt
            )"


            if [ -z "$db_line" ]; then

              echo "NEW:"
              echo "  $name $version"

              printf '%s\n' "$filename" \
                >> packages-to-add.txt

              continue

            fi


            db_version="$(printf '%s\t' "$db_line" | cut -f2)"
            db_filename="$(printf '%s\t' "$db_line" | cut -f3)"


            if [ "$db_version" != "$version" ]; then

              echo "UPDATED:"
              echo "  $name"
              echo "  old: $db_version"
              echo "  new: $version"

              printf '%s\n' "$db_filename" \
                >> packages-to-remove.txt

              printf '%s\n' "$filename" \
                >> packages-to-add.txt

            else

              echo "UNCHANGED:"
              echo "  $name $version"

            fi

          done < release-packages.txt


          #################################################
          # PACKAGES THAT EXIST ONLY IN DB
          #################################################

          while IFS=$'\t' read -r name version filename; do

            [ -z "$name" ] && continue

            if ! awk -F '\t' \
              -v n="$name" \
              '$1 == n {found=1} END {exit !found}' \
              release-packages.txt
            then

              echo "DELETED FROM RELEASE:"
              echo "  $name $version"

              printf '%s\n' "$filename" \
                >> packages-to-remove.txt

            fi

          done < db-packages.txt


          sort -u packages-to-add.txt \
            -o packages-to-add.txt

          sort -u packages-to-remove.txt \
            -o packages-to-remove.txt


          echo ""
          echo "=========================================="
          echo "TO ADD"
          echo "=========================================="

          cat packages-to-add.txt || true


          echo ""
          echo "=========================================="
          echo "TO REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true


      #################################################
      # REMOVE PACKAGES FROM DATABASE
      #################################################

      - name: Remove deleted and replaced packages
        run: |
          set -Eeuo pipefail

          if [ ! -f repo/methurepos.db.tar.gz ]; then
            echo "No existing DB. Nothing to remove."
            exit 0
          fi


          while IFS= read -r filename; do

            [ -z "$filename" ] && continue

            echo ""
            echo "Removing from repository:"
            echo "$filename"


            name="$(
              awk -F '\t' \
                -v f="$filename" \
                '$3 == f {print $1; exit}' \
                db-packages.txt
            )"


            if [ -n "$name" ]; then

              repo-remove \
                repo/methurepos.db.tar.gz \
                "$name"

            else

              echo "WARNING: Could not find package name for:"
              echo "$filename"

            fi

          done < packages-to-remove.txt


      #################################################
      # DOWNLOAD ONLY PACKAGES THAT NEED ADDING
      #################################################

      - name: Download new packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r filename; do

            [ -z "$filename" ] && continue

            echo ""
            echo "Downloading:"
            echo "$filename"

            if [ ! -f "packages/$filename" ]; then

              gh release download mr \
                --repo Methusan105/archconfig \
                --pattern "$filename" \
                --dir packages \
                --clobber

            else

              echo "Already downloaded during metadata check."

            fi

          done < packages-to-add.txt


      #################################################
      # ADD NEW PACKAGES
      #################################################

      - name: Add new packages to database
        run: |
          set -Eeuo pipefail

          if [ ! -s packages-to-add.txt ]; then
            echo "No packages need to be added."
          else

            while IFS= read -r filename; do

              [ -z "$filename" ] && continue

              echo ""
              echo "Adding:"
              echo "$filename"

              repo-add \
                repo/methurepos.db.tar.gz \
                "packages/$filename"

            done < packages-to-add.txt

          fi


      #################################################
      # HANDLE COMPLETELY EMPTY REPOSITORY
      #################################################

      - name: Handle empty repository
        run: |
          set -Eeuo pipefail

          if [ ! -f repo/methurepos.db.tar.gz ]; then

            echo "Database does not exist."

            first_pkg=""

            for pkg in packages/*.pkg.tar.zst; do

              if [ -f "$pkg" ]; then
                first_pkg="$pkg"
                break
              fi

            done


            if [ -n "$first_pkg" ]; then

              repo-add \
                repo/methurepos.db.tar.gz \
                "$first_pkg"

            else

              echo "No packages remain."

              mkdir -p empty-db

              repo-add \
                repo/methurepos.db.tar.gz \
                /dev/null \
                || true

            fi

          fi


      #################################################
      # CREATE methurepos.db
      #################################################

      - name: Create database copy
        run: |
          set -Eeuo pipefail

          rm -f repo/methurepos.db

          cp \
            repo/methurepos.db.tar.gz \
            repo/methurepos.db


      #################################################
      # VERIFY
      #################################################

      - name: Verify repository
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "FINAL REPOSITORY"
          echo "=========================================="

          ls -lah repo/

          echo ""
          echo "Database contents:"

          tar -tzf repo/methurepos.db.tar.gz


      #################################################
      # DELETE OLD GITHUB ASSETS
      #################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true

          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      #################################################
      # UPLOAD NEW DATABASE
      #################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


      #################################################
      # SUMMARY
      #################################################

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "       METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          echo ""
          echo "Added:"
          cat packages-to-add.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true
