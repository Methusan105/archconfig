name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # CHECKOUT
      #################################################

      - name: Checkout
        uses: actions/checkout@v4


      #################################################
      # DOWNLOAD EXISTING DATABASE
      #################################################

      - name: Download existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo

          echo "=== Downloading existing MethuRepo database ==="

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber || true

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.files.tar.gz' \
            --dir repo \
            --clobber || true

          ls -lah repo


      #################################################
      # GET RELEASE ASSETS
      #################################################

      - name: Get current release package list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            > release-assets.txt

          echo "=== Current release assets ==="

          cat release-assets.txt


      #################################################
      # DOWNLOAD ONLY PACKAGES THAT ARE NEEDED
      #################################################

      - name: Download required packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "=== Determining packages ==="

          touch existing-db-packages.txt
          touch release-packages.txt

          #################################################
          # PACKAGES IN RELEASE
          #################################################

          grep '\.pkg\.tar\.zst$' release-assets.txt \
            | sort \
            > release-packages.txt || true

          echo ""
          echo "Packages in release:"
          cat release-packages.txt || true


          #################################################
          # PACKAGES IN EXISTING DB
          #################################################

          if [ -f repo/methurepos.db.tar.gz ]; then

              echo ""
              echo "Reading existing database..."

              tar -xOf repo/methurepos.db.tar.gz \
                --wildcards '*/desc' 2>/dev/null \
                | awk '
                  /^%FILENAME%$/ {
                    getline
                    print
                  }
                ' \
                | sort \
                > existing-db-packages.txt || true

          fi

          echo ""
          echo "Packages in existing DB:"
          cat existing-db-packages.txt || true


          #################################################
          # DOWNLOAD NEW / REPLACED PACKAGES
          #################################################

          echo ""
          echo "=== Checking packages ==="

          while IFS= read -r pkg; do

              [ -z "$pkg" ] && continue

              if grep -Fxq "$pkg" existing-db-packages.txt; then

                  echo "UNCHANGED: $pkg"

              else

                  echo "NEEDED: $pkg"

                  gh release download mr \
                    --repo Methusan105/archconfig \
                    --pattern "$pkg" \
                    --dir repo \
                    --clobber

              fi

          done < release-packages.txt


      #################################################
      # UPDATE DATABASE
      #################################################

      - name: Synchronize repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD/repo:/repo" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /repo

              pacman -Sy --noconfirm pacman-contrib


              #################################################
              # CREATE DATABASE IF MISSING
              #################################################

              if [ ! -f methurepos.db.tar.gz ]; then

                  echo "No existing database."

                  if compgen -G "*.pkg.tar.zst" > /dev/null; then

                      repo-add methurepos.db.tar.gz \
                        ./*.pkg.tar.zst

                  else

                      echo "ERROR: No packages found."
                      exit 1

                  fi

              else

                  #################################################
                  # CREATE LIST OF CURRENT DB PACKAGES
                  #################################################

                  tar -xOf methurepos.db.tar.gz \
                    --wildcards "*/desc" 2>/dev/null \
                    | awk "
                      /^%FILENAME%$/ {
                        getline
                        print
                      }
                    " \
                    | sort \
                    > db-packages.txt || true


                  #################################################
                  # RELEASE PACKAGE LIST
                  #################################################

                  find . \
                    -maxdepth 1 \
                    -type f \
                    -name "*.pkg.tar.zst" \
                    -printf "%f\n" \
                    | sort \
                    > local-packages.txt


                  #################################################
                  # REMOVE PACKAGES NO LONGER IN RELEASE
                  #################################################

                  echo ""
                  echo "=== Checking for deleted packages ==="

                  while IFS= read -r oldpkg; do

                      [ -z "$oldpkg" ] && continue

                      if ! grep -Fxq "$oldpkg" local-packages.txt; then

                          echo "Removing old package: $oldpkg"

                          pkgname="$(
                              echo "$oldpkg" |
                              sed -E "s/-[0-9][^-]*-[0-9]+-x86_64\.pkg\.tar\.zst$//"
                          )"

                          echo "Package name: $pkgname"

                          repo-remove \
                            methurepos.db.tar.gz \
                            "$pkgname" || true

                      fi

                  done < db-packages.txt


                  #################################################
                  # ADD NEW PACKAGES
                  #################################################

                  echo ""
                  echo "=== Adding new packages ==="

                  for pkg in ./*.pkg.tar.zst; do

                      [ -f "$pkg" ] || continue

                      filename="$(basename "$pkg")"

                      if grep -Fxq "$filename" db-packages.txt; then

                          echo "Already present: $filename"

                      else

                          echo "Adding: $filename"

                          repo-add \
                            methurepos.db.tar.gz \
                            "$pkg"

                      fi

                  done


                  #################################################
                  # REBUILD FILES DATABASE
                  #################################################

                  echo ""
                  echo "=== Rebuilding files database ==="

                  if compgen -G "*.pkg.tar.zst" > /dev/null; then

                      repo-add \
                        --files \
                        methurepos.db.tar.gz \
                        ./*.pkg.tar.zst

                  fi

              fi


              #################################################
              # OUTPUT
              #################################################

              echo ""
              echo "=== Final repository ==="

              ls -lah methurepos*

            '


      #################################################
      # CREATE NON-SYMLINK DATABASE FILES
      #################################################

      - name: Prepare database assets
        run: |
          set -Eeuo pipefail

          cd repo

          rm -f methurepos.db
          rm -f methurepos.files

          cp -L \
            methurepos.db.tar.gz \
            methurepos.db

          if [ -f methurepos.files.tar.gz ]; then
              cp -L \
                methurepos.files.tar.gz \
                methurepos.files
          fi

          echo "=== Database assets ==="

          ls -lah methurepos*


      #################################################
      # REMOVE OLD DATABASE ASSETS
      #################################################

      - name: Remove old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "=== Removing old repository database assets ==="

          for asset in \
            methurepos.db \
            methurepos.db.tar.gz \
            methurepos.files \
            methurepos.files.tar.gz
          do

              gh release delete-asset mr \
                "$asset" \
                --repo Methusan105/archconfig \
                --yes \
                || true

          done


      #################################################
      # UPLOAD NEW DATABASE
      #################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            repo/methurepos.files \
            repo/methurepos.files.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


      #################################################
      # CLEAN DELETED PACKAGE ASSETS
      #################################################

      - name: Remove deleted package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            > final-assets.txt

          echo "=== Checking package assets ==="

          while IFS= read -r asset; do

              [ -z "$asset" ] && continue

              case "$asset" in
                  *.pkg.tar.zst)
                      ;;
                  *)
                      continue
                      ;;
              esac

              if ! grep -Fxq "$asset" release-packages.txt; then

                  echo "Deleting obsolete package asset: $asset"

                  gh release delete-asset mr \
                    "$asset" \
                    --repo Methusan105/archconfig \
                    --yes

              fi

          done < final-assets.txt


      #################################################
      # UPLOAD NEW PACKAGES
      #################################################

      - name: Upload package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          cd repo

          echo "=== Uploading packages ==="

          for pkg in *.pkg.tar.zst; do

              [ -f "$pkg" ] || continue

              echo "Uploading: $pkg"

              gh release upload mr \
                "$pkg" \
                --repo Methusan105/archconfig \
                --clobber

          done


      #################################################
      # COMPLETE
      #################################################

      - name: Complete
        run: |
          echo ""
          echo "=============================================="
          echo " MethuRepo successfully synchronized"
          echo "=============================================="
          echo ""
          echo "Release: mr"
          echo "Database: methurepos.db.tar.gz"
          echo ""
