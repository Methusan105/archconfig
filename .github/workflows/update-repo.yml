name: Update MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-methurepos:
    runs-on: ubuntu-latest

    steps:

      ############################################################
      # DOWNLOAD CURRENT REPOSITORY DATABASE
      ############################################################

      - name: Download existing repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing methurepos database found."
          else
            echo "No existing database. A new repository will be created."
          fi


      ############################################################
      # GET ALL PACKAGE ASSETS FROM MR
      ############################################################

      - name: Read mr release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            | grep -E '\.pkg\.tar\.zst$' \
            | sort -u \
            > release-packages.txt \
            || true

          echo ""
          echo "=========================================="
          echo "Packages in mr"
          echo "=========================================="

          cat release-packages.txt || true


      ############################################################
      # READ THE REAL ARCH DATABASE
      ############################################################

      - name: Read existing Arch repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm pacman-contrib


              ####################################################
              # CREATE EMPTY DATABASE IF NECESSARY
              ####################################################

              if [ ! -f repo/methurepos.db.tar.gz ]; then

                echo "Creating empty repository database..."

                mkdir -p /tmp/emptyrepo

                repo-add \
                  /tmp/emptyrepo/methurepos.db.tar.gz

                cp \
                  /tmp/emptyrepo/methurepos.db.tar.gz \
                  repo/methurepos.db.tar.gz

              fi


              ####################################################
              # LOCAL PACMAN REPOSITORY
              ####################################################

              mkdir -p /tmp/methurepos
              mkdir -p /tmp/pacmandb
              mkdir -p /tmp/cache


              cp \
                repo/methurepos.db.tar.gz \
                /tmp/methurepos/methurepos.db.tar.gz


              cat > /tmp/pacman.conf <<EOF
              [options]
              Architecture = x86_64
              SigLevel = Never
              DBPath = /tmp/pacmandb
              CacheDir = /tmp/cache

              [methurepos]
              SigLevel = Never
              Server = file:///tmp/methurepos
              EOF


              ####################################################
              # LOAD DATABASE USING PACMAN
              ####################################################

              pacman \
                --config /tmp/pacman.conf \
                -Sy


              ####################################################
              # GET PACKAGE LIST
              ####################################################

              pacman \
                --config /tmp/pacman.conf \
                -Sl methurepos \
                > /work/db-packages.txt


              echo ""
              echo "=========================================="
              echo "Packages currently in database"
              echo "=========================================="

              cat /work/db-packages.txt || true


              ####################################################
              # GET ACTUAL PACKAGE FILENAMES FROM PACMAN
              ####################################################

              : > /work/db-package-files.txt


              while read -r repo package version; do

                [ -z "${package:-}" ] && continue


                filename="$(
                  pacman \
                    --config /tmp/pacman.conf \
                    -Si "$package" \
                    2>/dev/null |
                  awk -F': ' \
                    '/^Filename/ {
                      print $2
                      exit
                    }'
                )"


                if [ -n "$filename" ]; then

                  printf '%s\t%s\t%s\n' \
                    "$package" \
                    "$version" \
                    "$filename" \
                    >> /work/db-package-files.txt

                fi

              done < /work/db-packages.txt


              echo ""
              echo "=========================================="
              echo "Database package metadata"
              echo "=========================================="

              cat /work/db-package-files.txt || true

            '


      ############################################################
      # COMPARE RELEASE AGAINST DATABASE
      ############################################################

      - name: Compare release with database
        run: |
          set -Eeuo pipefail

          : > packages-to-download.txt
          : > packages-to-remove.txt


          echo ""
          echo "=========================================="
          echo "COMPARING RELEASE WITH DATABASE"
          echo "=========================================="


          ########################################################
          # EXACT UNCHANGED MATCH
          #
          # If the exact filename exists in the DB, the package
          # is unchanged. No download required.
          ########################################################

          while IFS= read -r release_file; do

            [ -z "$release_file" ] && continue


            if grep -F -q \
              $'\t'"$release_file"$ \
              db-package-files.txt 2>/dev/null
            then

              echo "UNCHANGED: $release_file"

            else

              echo "NEW/UPDATED: $release_file"

              echo "$release_file" \
                >> packages-to-download.txt

            fi

          done < release-packages.txt


          ########################################################
          # FIND PACKAGES THAT WERE REPLACED
          #
          # We need to remove the old package if the same package
          # exists with a different version/filename.
          ########################################################

          echo ""
          echo "=========================================="
          echo "Checking replaced packages"
          echo "=========================================="


          while IFS=$'\t' read -r db_name db_version db_filename; do

            [ -z "$db_name" ] && continue


            found=false


            ######################################################
            # Search release filenames for the same package name.
            #
            # We only need the package-name part here because the
            # DB gives us the authoritative old filename.
            ######################################################

            while IFS= read -r release_file; do

              [ -z "$release_file" ] && continue


              release_base="${release_file%.pkg.tar.zst}"


              ####################################################
              # Compare against DB package name.
              #
              # Arch package names can contain '-'.
              # The safest way here is to test whether the DB
              # package name is the prefix followed by '-'.
              ####################################################

              case "$release_base" in

                "$db_name"-*)

                  found=true
                  break
                  ;;

              esac

            done < release-packages.txt


            if [ "$found" = false ]; then

              echo "DELETED: $db_name"

              echo "$db_name" \
                >> packages-to-remove.txt

            else

              ####################################################
              # Same package exists in release, but exact filename
              # wasn't found. Therefore it is an update.
              ####################################################

              if ! grep -F -q \
                $'\t'"$db_filename"$ \
                release-packages.txt 2>/dev/null
              then

                echo "REPLACED: $db_name"
                echo "  old: $db_filename"

                echo "$db_name" \
                  >> packages-to-remove.txt

              fi

            fi

          done < db-package-files.txt


          ########################################################
          # REMOVE DUPLICATES
          ########################################################

          sort -u \
            packages-to-download.txt \
            -o packages-to-download.txt


          sort -u \
            packages-to-remove.txt \
            -o packages-to-remove.txt


          ########################################################
          # SUMMARY
          ########################################################

          echo ""
          echo "=========================================="
          echo "PACKAGES TO DOWNLOAD"
          echo "=========================================="

          cat packages-to-download.txt || true


          echo ""
          echo "=========================================="
          echo "PACKAGES TO REMOVE"
          echo "=========================================="

          cat packages-to-remove.txt || true


      ############################################################
      # DOWNLOAD ONLY NEW/UPDATED PACKAGES
      ############################################################

      - name: Download changed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r package; do

            [ -z "$package" ] && continue

            echo ""
            echo "Downloading:"
            echo "$package"

            gh release download mr \
              --repo Methusan105/archconfig \
              --pattern "$package" \
              --dir packages \
              --clobber

          done < packages-to-download.txt


      ############################################################
      # UPDATE ARCH DATABASE
      ############################################################

      - name: Update repository
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              pacman -Sy --noconfirm pacman-contrib


              ####################################################
              # REMOVE OLD / DELETED PACKAGES
              ####################################################

              echo ""
              echo "=========================================="
              echo "Removing old packages"
              echo "=========================================="


              if [ -f packages-to-remove.txt ]; then

                while IFS= read -r package; do

                  [ -z "$package" ] && continue

                  echo "Removing: $package"

                  repo-remove \
                    repo/methurepos.db.tar.gz \
                    "$package"

                done < packages-to-remove.txt

              fi


              ####################################################
              # ADD NEW / UPDATED PACKAGES
              ####################################################

              echo ""
              echo "=========================================="
              echo "Adding packages"
              echo "=========================================="


              for package in packages/*.pkg.tar.zst; do

                [ -f "$package" ] || continue

                echo "Adding:"
                echo "$package"

                repo-add \
                  repo/methurepos.db.tar.gz \
                  "$package"

              done


              ####################################################
              # RECREATE DB SYMLINK
              ####################################################

              rm -f repo/methurepos.db

              ln -s \
                methurepos.db.tar.gz \
                repo/methurepos.db


              ####################################################
              # REBUILD FILES DATABASE
              ####################################################

              rm -f \
                repo/methurepos.files \
                repo/methurepos.files.tar.gz


              repo-add \
                --files \
                repo/methurepos.db.tar.gz \
                packages/*.pkg.tar.zst \
                2>/dev/null \
                || true


              ####################################################
              # FIX FILES SYMLINK
              ####################################################

              if [ -f repo/methurepos.files.tar.gz ]; then

                rm -f repo/methurepos.files

                ln -s \
                  methurepos.files.tar.gz \
                  repo/methurepos.files

              fi


              echo ""
              echo "=========================================="
              echo "FINAL REPOSITORY"
              echo "=========================================="

              ls -lah repo/

            '


      ############################################################
      # VERIFY DATABASE
      ############################################################

      - name: Verify final database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

              set -Eeuo pipefail

              cd /work

              mkdir -p /tmp/repo
              mkdir -p /tmp/db
              mkdir -p /tmp/cache


              cp \
                repo/methurepos.db.tar.gz \
                /tmp/repo/methurepos.db.tar.gz


              cat > /tmp/pacman.conf <<EOF
              [options]
              Architecture = x86_64
              SigLevel = Never
              DBPath = /tmp/db
              CacheDir = /tmp/cache

              [methurepos]
              SigLevel = Never
              Server = file:///tmp/repo
              EOF


              pacman \
                --config /tmp/pacman.conf \
                -Sy


              echo ""
              echo "=========================================="
              echo "FINAL PACMAN REPOSITORY"
              echo "=========================================="


              pacman \
                --config /tmp/pacman.conf \
                -Sl methurepos

            '


      ############################################################
      # DELETE OLD RELEASE DATABASE
      ############################################################

      - name: Delete old database assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release delete-asset mr \
            methurepos.files \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release delete-asset mr \
            methurepos.files.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


      ############################################################
      # UPLOAD NEW DATABASE
      ############################################################

      - name: Upload new database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh release upload mr \
            repo/methurepos.db.tar.gz \
            repo/methurepos.db \
            --repo Methusan105/archconfig \
            --clobber


          if [ -e repo/methurepos.files.tar.gz ]; then

            gh release upload mr \
              repo/methurepos.files.tar.gz \
              repo/methurepos.files \
              --repo Methusan105/archconfig \
              --clobber

          fi


      ############################################################
      # SUMMARY
      ############################################################

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "       METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          echo ""
          echo "Downloaded:"
          cat packages-to-download.txt || true

          echo ""
          echo "Removed:"
          cat packages-to-remove.txt || true

          echo ""
          echo "Repository files:"
          ls -lah repo/
