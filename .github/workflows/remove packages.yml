name: Remove Packages from MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DOWNLOAD CURRENT DATABASE & FETCH RELEASE ASSETS
      # ============================================================

      - name: Fetch DB and release asset catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p repo work

          echo "Downloading repository database..."
          if gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db*' \
            --dir repo \
            --clobber; then
              echo "Database files downloaded."
          else
              echo "No database found in release."
              exit 0
          fi

          echo "Fetching current list of release package assets..."
          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            | grep '\.pkg\.tar\.zst$' > work/release_assets.txt || true

          echo "=== RELEASE ASSETS FOUND ==="
          cat work/release_assets.txt || true
          echo "============================"

      # ============================================================
      # 2. IDENTIFY DELETED PACKAGES & REMOVE FROM DB (DOCKER)
      # ============================================================

      - name: Identify and remove orphaned packages
        id: check_removals
        run: |
          set -Eeuo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash << 'EOF'
          set -Eeuo pipefail

          cd /work

          echo "Installing database extraction tools..."
          pacman -Sy --noconfirm pacman-contrib libarchive > /dev/null

          rm -rf /tmp/methurepos-db
          mkdir -p /tmp/methurepos-db

          if [ ! -f repo/methurepos.db.tar.gz ]; then
              echo "No database tarball found. Exiting."
              exit 0
          fi

          # Extract DB tarball
          bsdtar -xzf repo/methurepos.db.tar.gz -C /tmp/methurepos-db 2>/dev/null || true

          : > work/db_entries.txt
          : > work/remove_names.txt

          # Parse DB desc files to match Package Name <-> Filename
          for desc in /tmp/methurepos-db/*/desc; do
              [ -f "$desc" ] || continue

              pkg_name=""
              pkg_file=""

              while IFS= read -r line; do
                  case "$line" in
                      "%NAME%")     IFS= read -r pkg_name ;;
                      "%FILENAME%") IFS= read -r pkg_file ;;
                  esac
              done < "$desc"

              if [ -n "$pkg_name" ] && [ -n "$pkg_file" ]; then
                  echo -e "${pkg_name}\t${pkg_file}" >> work/db_entries.txt
              fi
          done

          echo
          echo "=========================================="
          echo "CHECKING FOR REMOVED PACKAGES"
          echo "=========================================="

          while IFS=$'\t' read -r name filename; do
              [ -n "$name" ] || continue

              if grep -qx "$filename" work/release_assets.txt; then
                  echo "-> KEEP:   $name ($filename)"
              else
                  echo "-> REMOVE: $name ($filename missing from release)"
                  echo "$name" >> work/remove_names.txt
              fi
          done < work/db_entries.txt

          if [ ! -s work/remove_names.txt ]; then
              echo "No orphaned packages found. Database is up to date."
              touch work/no_changes
              exit 0
          fi

          echo
          echo "=========================================="
          echo "RUNNING REPO-REMOVE"
          echo "=========================================="

          while IFS= read -r name; do
              [ -n "$name" ] || continue
              echo "Removing package '$name' from database..."
              repo-remove repo/methurepos.db.tar.gz "$name"
          done < work/remove_names.txt

          # Unlink/Remove the symlink created by repo-remove before copying
          rm -f repo/methurepos.db
          cp -f repo/methurepos.db.tar.gz repo/methurepos.db

          if [ -f repo/methurepos.files.tar.gz ]; then
              rm -f repo/methurepos.files
              cp -f repo/methurepos.files.tar.gz repo/methurepos.files 2>/dev/null || true
          fi

          echo
          echo "=========================================="
          echo "DATABASE REMOVAL COMPLETE"
          echo "=========================================="
          ls -lh repo/methurepos.db*
          EOF

          # Set GITHUB_OUTPUT based on execution result
          if [ -f work/no_changes ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 3. UPLOAD UPDATED DATABASE
      # ============================================================

      - name: Upload updated database
        if: steps.check_removals.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f repo/methurepos.db ]; then
            echo "No database file exists to upload."
            exit 0
          fi

          echo "Uploading modified database..."

          gh release upload mr \
            repo/methurepos.db \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber

          echo "Upload complete."

      # ============================================================
      # 4. SUMMARY
      # ============================================================

      - name: Summary
        run: |
          echo "=========================================="
          echo "REMOVAL SUMMARY"
          echo "=========================================="

          if [ "${{ steps.check_removals.outputs.has_changes }}" = "true" ]; then
            echo "Status: Database updated and uploaded successfully."
            ls -lh repo/methurepos.db* 2>/dev/null || true
          else
            echo "Status: No packages were removed. Database is already in sync."
          fi
