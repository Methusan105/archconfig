name: MethuRepo - Add Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SETUP ENVIRONMENT & UTILITIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd gh

      # ============================================================
      # DOWNLOAD EXISTING DB IF IT EXISTS
      # ============================================================

      - name: Download existing database if available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work/db_extract work/packages work/add

          echo "Checking for existing methurepos database..."

          if gh release download mr \
              --repo Methusan105/archconfig \
              --pattern 'methurepos.db.tar.gz' \
              --dir work \
              --clobber; then

              echo "Existing database found."
              ls -lh work/methurepos.db.tar.gz
              
              # Extract existing database entries
              bsdtar -xzf work/methurepos.db.tar.gz -C work/db_extract 2>/dev/null || true
          else
              echo "No existing database found. A new database will be created."
          fi

      # ============================================================
      # DOWNLOAD ALL PACKAGES FROM MR
      # ============================================================

      - name: Download packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "Downloading packages from mr..."

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern '*.pkg.tar.zst' \
            --dir work/packages \
            --clobber

          echo
          echo "Packages found:"

          find work/packages -type f -name '*.pkg.tar.zst' -exec basename {} \; | sort

          COUNT=$(find work/packages -type f -name '*.pkg.tar.zst' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .pkg.tar.zst packages found in mr."
            exit 1
          fi

          echo "Total packages: $COUNT"

      # ============================================================
      # BUILD REPOSITORY DATABASE NATIVELY
      # ============================================================

      - name: Process packages and create database
        run: |
          set -Eeuo pipefail

          shopt -s nullglob

          ADD_COUNT=0
          NEW_DB_DIR="work/new_db"
          mkdir -p "$NEW_DB_DIR"

          # Copy existing db entries over
          if [ -d work/db_extract ] && [ "$(ls -A work/db_extract)" ]; then
            cp -r work/db_extract/* "$NEW_DB_DIR/"
          fi

          echo
          echo "=========================================="
          echo "PROCESSING PACKAGES"
          echo "=========================================="

          for pkg in work/packages/*.pkg.tar.zst; do
              filename="$(basename "$pkg")"
              
              # Extract .PKGINFO from the package without installing anything
              pkginfo="$(bsdtar -xOf "$pkg" .PKGINFO 2>/dev/null || true)"
              
              if [ -z "$pkginfo" ]; then
                echo "Warning: Could not read .PKGINFO from $filename, skipping."
                continue
              fi

              pkgname="$(echo "$pkginfo" | awk -F ' = ' '/^pkgname =/ {print $2}')"
              pkgver="$(echo "$pkginfo" | awk -F ' = ' '/^pkgver =/ {print $2}')"
              pkgdesc="$(echo "$pkginfo" | awk -F ' = ' '/^pkgdesc =/ {print $2}')"
              csize="$(stat -c%s "$pkg")"

              echo "Checking: $filename ($pkgname $pkgver)"

              target_dir="$NEW_DB_DIR/$pkgname-$pkgver"

              # Check if this exact package entry exists already
              if [ -d "$target_dir" ]; then
                echo "-> UNCHANGED"
                continue
              fi

              # Clean up old versions of the same package name if updating
              rm -rf "$NEW_DB_DIR/${pkgname}-"*

              echo "-> ADDING/UPDATING"
              mkdir -p "$target_dir"

              # Create Arch DB 'desc' file directly
              cat <<EOF > "$target_dir/desc"
          %FILENAME%
          $filename

          %NAME%
          $pkgname

          %VERSION%
          $pkgver

          %DESC%
          $pkgdesc

          %CSIZE%
          $csize

          EOF

              ADD_COUNT=$((ADD_COUNT + 1))
          done

          echo
          echo "=========================================="
          echo "RESULT"
          echo "=========================================="

          if [ "$ADD_COUNT" -eq 0 ] && [ -f work/methurepos.db.tar.gz ]; then
            echo "No changes required."
            exit 0
          fi

          echo "Packages modified: $ADD_COUNT"

          # Compress into methurepos.db.tar.gz
          echo "Packaging database archive..."
          tar -czf work/methurepos.db.tar.gz -C "$NEW_DB_DIR" .

          ls -lh work/methurepos.db.tar.gz

      # ============================================================
      # UPLOAD DATABASE
      # ============================================================

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f work/methurepos.db.tar.gz ]; then
            echo "No changes were required. Nothing to upload."
            exit 0
          fi

          echo "Uploading updated database..."

          gh release upload mr \
            work/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber

          echo "Database uploaded successfully."
