name: Add Packages to MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      ############################################################
      # DOWNLOAD CURRENT DATABASE
      ############################################################

      - name: Download current MethuRepo database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          rm -rf repo
          mkdir -p repo

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir repo \
            --clobber \
            || true

          if [ -f repo/methurepos.db.tar.gz ]; then
            echo "Existing MethuRepo database found."
          else
            echo "No existing database."
          fi


      ############################################################
      # DOWNLOAD MR PACKAGES
      ############################################################

      - name: Download packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          rm -rf release-packages
          mkdir -p release-packages

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern '*.pkg.tar.zst' \
            --dir release-packages \
            --clobber \
            || true

          echo
          echo "=========================================="
          echo "PACKAGES IN MR"
          echo "=========================================="

          find release-packages \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            | sort


      ############################################################
      # COMPARE USING ARCH/PACMAN
      ############################################################

      - name: Compare packages
        run: |
          set -Eeuo pipefail

          rm -rf packages
          mkdir -p packages

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash <<'CONTAINER'

          set -Eeuo pipefail

          cd /work

          pacman -Sy --noconfirm pacman-contrib


          ########################################################
          # READ EXISTING DATABASE
          ########################################################

          : > /tmp/existing.txt


          if [ -f repo/methurepos.db.tar.gz ]; then

              rm -rf /tmp/methurepos-db
              mkdir -p /tmp/methurepos-db


              bsdtar \
                  -xzf \
                  repo/methurepos.db.tar.gz \
                  -C \
                  /tmp/methurepos-db


              for desc in /tmp/methurepos-db/*/desc; do

                  [ -f "$desc" ] || continue


                  name=""
                  version=""
                  filename=""


                  while IFS= read -r line; do

                      case "$line" in

                          "%NAME%")
                              IFS= read -r name
                              ;;

                          "%VERSION%")
                              IFS= read -r version
                              ;;

                          "%FILENAME%")
                              IFS= read -r filename
                              ;;

                      esac

                  done < "$desc"


                  if [ -n "$name" ]; then

                      printf '%s\t%s\t%s\n' \
                          "$name" \
                          "$version" \
                          "$filename" \
                          >> /tmp/existing.txt

                  fi

              done

          fi


          echo
          echo "=========================================="
          echo "EXISTING METHUREPOS"
          echo "=========================================="


          if [ -s /tmp/existing.txt ]; then
              cat /tmp/existing.txt
          else
              echo "Database is empty."
          fi


          ########################################################
          # CHECK MR PACKAGES
          ########################################################

          shopt -s nullglob

          release_packages=(
              /work/release-packages/*.pkg.tar.zst
          )


          echo
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="


          for pkg in "${release_packages[@]}"; do

              filename="$(basename "$pkg")"


              name="$(
                  pacman -Qp \
                      --print-format '%n' \
                      "$pkg"
              )"


              version="$(
                  pacman -Qp \
                      --print-format '%v' \
                      "$pkg"
              )"


              echo
              echo "Checking: $filename"
              echo "Package:  $name"
              echo "Version:  $version"


              existing="$(
                  awk -F '\t' \
                      -v package="$name" \
                      '$1 == package {print; exit}' \
                      /tmp/existing.txt
              )"


              ####################################################
              # PACKAGE DOES NOT EXIST
              ####################################################

              if [ -z "$existing" ]; then

                  echo "-> NEW"

                  cp \
                      "$pkg" \
                      "/work/packages/$filename"

                  continue

              fi


              old_version="$(printf '%s\n' "$existing" | cut -f2)"
              old_filename="$(printf '%s\n' "$existing" | cut -f3)"


              ####################################################
              # EXACT SAME PACKAGE
              ####################################################

              if [ "$old_filename" = "$filename" ]; then

                  echo "-> UNCHANGED"

                  continue

              fi


              ####################################################
              # PACKAGE VERSION/BUILD CHANGED
              ####################################################

              echo "-> UPDATED"
              echo "Old: $old_filename"
              echo "New: $filename"


              cp \
                  "$pkg" \
                  "/work/packages/$filename"

          done


          ########################################################
          # SHOW PACKAGES TO ADD
          ########################################################

          echo
          echo "=========================================="
          echo "PACKAGES TO ADD"
          echo "=========================================="


          packages=(
              /work/packages/*.pkg.tar.zst
          )


          if [ "${#packages[@]}" -eq 0 ]; then

              echo "Nothing to add."

              exit 0

          fi


          printf '%s\n' "${packages[@]}"


          ########################################################
          # REMOVE OLD SYMLINK
          ########################################################

          rm -f repo/methurepos.db


          ########################################################
          # CREATE/UPDATE DATABASE
          ########################################################

          echo
          echo "=========================================="
          echo "RUNNING REPO-ADD"
          echo "=========================================="


          if [ -f repo/methurepos.db.tar.gz ]; then

              repo-add \
                  repo/methurepos.db.tar.gz \
                  "${packages[@]}"

          else

              repo-add \
                  repo/methurepos.db.tar.gz \
                  "${packages[@]}"

          fi


          ########################################################
          # CREATE DB SYMLINK
          ########################################################

          rm -f repo/methurepos.db

          ln -s \
              methurepos.db.tar.gz \
              repo/methurepos.db


          echo
          echo "=========================================="
          echo "FINAL REPOSITORY"
          echo "=========================================="


          ls -lah repo/


          CONTAINER


      ############################################################
      # UPLOAD UPDATED DATABASE
      ############################################################

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail


          if [ ! -f repo/methurepos.db.tar.gz ]; then

            echo "No database was created/changed."
            exit 0

          fi


          echo "Deleting old database assets..."


          gh release delete-asset mr \
            methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --yes \
            || true


          gh release delete-asset mr \
            methurepos.db \
            --repo Methusan105/archconfig \
            --yes \
            || true


          echo "Uploading new database..."


          gh release upload mr \
            repo/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


          gh release upload mr \
            repo/methurepos.db \
            --repo Methusan105/archconfig \
            --clobber


      ############################################################
      # SUMMARY
      ############################################################

      - name: Summary
        run: |
          echo
          echo "=========================================="
          echo "ADD PACKAGES COMPLETE"
          echo "=========================================="

          echo
          echo "Packages added/updated:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "Repository database:"

          ls -lah repo/
