name: Add Packages to MethuRepo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # DOWNLOAD EXISTING DATABASE
      # ============================================================

      - name: Download existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work

          echo "Downloading existing methurepos database..."

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern 'methurepos.db.tar.gz' \
            --dir work \
            --clobber

          test -f work/methurepos.db.tar.gz

          echo "Existing database:"
          ls -lh work/methurepos.db.tar.gz


      # ============================================================
      # DOWNLOAD PACKAGES FROM MR
      # ============================================================

      - name: Download mr packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work/mr

          echo "Downloading packages from mr..."

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern '*.pkg.tar.zst' \
            --dir work/mr \
            --clobber

          echo
          echo "Packages in mr:"
          find work/mr \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            | sort


      # ============================================================
      # COMPARE AND UPDATE
      # ============================================================

      - name: Compare and update database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

          set -Eeuo pipefail

          cd /work


          echo
          echo "=========================================="
          echo "INSTALLING PACMAN-CONTRIB"
          echo "=========================================="


          pacman -Sy --noconfirm pacman-contrib


          # ========================================================
          # CREATE TEMPORARY REPOSITORY
          # ========================================================

          rm -rf /tmp/repo

          mkdir -p /tmp/repo


          # IMPORTANT:
          # Never modify the downloaded database directly.
          # Work on a copy instead.

          cp \
            work/methurepos.db.tar.gz \
            /tmp/repo/methurepos.db.tar.gz


          echo
          echo "=========================================="
          echo "READING EXISTING DATABASE"
          echo "=========================================="


          rm -rf /tmp/db

          mkdir -p /tmp/db


          bsdtar \
            -xzf \
            /tmp/repo/methurepos.db.tar.gz \
            -C \
            /tmp/db


          : > /tmp/existing.txt


          for desc in /tmp/db/*/desc; do

              [ -f "$desc" ] || continue


              name=""
              version=""
              filename=""


              while IFS= read -r line; do

                  case "$line" in

                      "%NAME%")
                          IFS= read -r name
                          ;;

                      "%VERSION%")
                          IFS= read -r version
                          ;;

                      "%FILENAME%")
                          IFS= read -r filename
                          ;;

                  esac

              done < "$desc"


              if [ -n "$name" ]; then

                  printf "%s\t%s\t%s\n" \
                    "$name" \
                    "$version" \
                    "$filename" \
                    >> /tmp/existing.txt

              fi

          done


          echo
          echo "Existing packages:"

          cat /tmp/existing.txt || true


          # ========================================================
          # FIND NEW/UPDATED PACKAGES
          # ========================================================

          rm -rf /tmp/to-add

          mkdir -p /tmp/to-add


          : > /tmp/to-add.txt


          echo
          echo "=========================================="
          echo "COMPARING WITH MR"
          echo "=========================================="


          shopt -s nullglob


          mr_packages=(
            /work/work/mr/*.pkg.tar.zst
          )


          if [ "${#mr_packages[@]}" -eq 0 ]; then

              echo "ERROR: No packages found in mr."

              exit 1

          fi


          for pkg in "${mr_packages[@]}"; do

              filename="$(basename "$pkg")"


              name="$(
                pacman -Qp \
                  --print-format "%n" \
                  "$pkg"
              )"


              version="$(
                pacman -Qp \
                  --print-format "%v" \
                  "$pkg"
              )"


              echo
              echo "Checking: $filename"
              echo "Package:  $name"
              echo "Version:  $version"


              existing="$(
                awk -F "\t" \
                  -v n="$name" \
                  "\$1 == n {print; exit}" \
                  /tmp/existing.txt
              )"


              # ----------------------------------------------------
              # PACKAGE DOES NOT EXIST
              # ----------------------------------------------------

              if [ -z "$existing" ]; then

                  echo "-> NEW"

                  cp \
                    "$pkg" \
                    "/tmp/to-add/$filename"

                  echo "$filename" \
                    >> /tmp/to-add.txt

                  continue

              fi


              old_version="$(printf "%s\n" "$existing" | cut -f2)"
              old_filename="$(printf "%s\n" "$existing" | cut -f3)"


              # ----------------------------------------------------
              # EXACT SAME PACKAGE
              # ----------------------------------------------------

              if [ "$old_filename" = "$filename" ]; then

                  echo "-> UNCHANGED"

                  continue

              fi


              # ----------------------------------------------------
              # PACKAGE CHANGED
              # ----------------------------------------------------

              echo "-> UPDATED"

              echo "Old: $old_filename"
              echo "New: $filename"


              cp \
                "$pkg" \
                "/tmp/to-add/$filename"


              echo "$filename" \
                >> /tmp/to-add.txt

          done


          # ========================================================
          # NOTHING TO DO
          # ========================================================

          echo
          echo "=========================================="
          echo "PACKAGES TO ADD"
          echo "=========================================="


          if [ ! -s /tmp/to-add.txt ]; then

              echo "Nothing to add."
              echo
              echo "Existing database was NOT modified."

              exit 0

          fi


          cat /tmp/to-add.txt


          # ========================================================
          # UPDATE TEMPORARY DATABASE
          # ========================================================

          echo
          echo "=========================================="
          echo "UPDATING TEMPORARY DATABASE"
          echo "=========================================="


          packages=(
            /tmp/to-add/*.pkg.tar.zst
          )


          repo-add \
            /tmp/repo/methurepos.db.tar.gz \
            "${packages[@]}"


          # ========================================================
          # VERIFY DATABASE
          # ========================================================

          echo
          echo "=========================================="
          echo "VERIFYING DATABASE"
          echo "=========================================="


          test -s /tmp/repo/methurepos.db.tar.gz


          rm -rf /tmp/verify

          mkdir -p /tmp/verify


          bsdtar \
            -xzf \
            /tmp/repo/methurepos.db.tar.gz \
            -C \
            /tmp/verify


          count="$(
            find /tmp/verify \
              -mindepth 2 \
              -maxdepth 2 \
              -name desc \
              | wc -l
          )"


          echo "Packages in final database: $count"


          if [ "$count" -eq 0 ]; then

              echo "ERROR: Updated database is empty."

              exit 1

          fi


          # ========================================================
          # ONLY NOW REPLACE THE REAL DATABASE
          # ========================================================

          echo
          echo "=========================================="
          echo "COMMITTING DATABASE"
          echo "=========================================="


          cp \
            /tmp/repo/methurepos.db.tar.gz \
            work/methurepos.db.tar.gz


          # repo-add normally creates this symlink itself.
          # Recreate it explicitly to guarantee the correct
          # archive-agnostic filename.

          rm -f work/methurepos.db

          ln -s \
            methurepos.db.tar.gz \
            work/methurepos.db


          echo
          echo "FINAL DATABASE:"

          ls -lah work/


          '


      # ============================================================
      # UPLOAD ONLY AFTER SUCCESS
      # ============================================================

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f work/methurepos.db.tar.gz ]; then
            echo "No database update was required."
            exit 0
          fi


          echo "Uploading updated database..."


          gh release upload mr \
            work/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


          gh release upload mr \
            work/methurepos.db \
            --repo Methusan105/archconfig \
            --clobber


      # ============================================================
      # FINAL
      # ============================================================

      - name: Complete
        run: |
          echo
          echo "=========================================="
          echo "METHUREPOS ADD COMPLETE"
          echo "=========================================="

          ls -lah work/
