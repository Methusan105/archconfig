name: MethuRepo - Add Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # DOWNLOAD EXISTING DB IF IT EXISTS
      # ============================================================

      - name: Download existing database if available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work

          echo "Checking for existing methurepos database..."

          if gh release download mr \
              --repo Methusan105/archconfig \
              --pattern 'methurepos.db.tar.gz' \
              --dir work \
              --clobber; then

              echo "Existing database found."

              ls -lh work/methurepos.db.tar.gz

          else

              echo "No existing database found."
              echo "A new database will be created."

              rm -f work/methurepos.db.tar.gz

          fi


      # ============================================================
      # DOWNLOAD ALL PACKAGES FROM MR
      # ============================================================

      - name: Download packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work/packages

          echo "Downloading packages from mr..."

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern '*.pkg.tar.zst' \
            --dir work/packages \
            --clobber

          echo
          echo "Packages found:"

          find work/packages \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            | sort

          COUNT=$(find work/packages \
            -type f \
            -name '*.pkg.tar.zst' \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .pkg.tar.zst packages found in mr."
            exit 1
          fi

          echo
          echo "Total packages: $COUNT"


      # ============================================================
      # UPDATE REPOSITORY
      # ============================================================

      - name: Update repository database
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -c '

          set -Eeuo pipefail

          cd /work


          # ========================================================
          # INSTALL REPO TOOLS
          # ========================================================

          echo
          echo "=========================================="
          echo "INSTALLING ARCH REPOSITORY TOOLS"
          echo "=========================================="

          pacman -Sy --noconfirm pacman-contrib


          # ========================================================
          # TEMPORARY WORKSPACE
          # ========================================================

          rm -rf /tmp/methurepo

          mkdir -p /tmp/methurepo


          # ========================================================
          # EXISTING DATABASE
          # ========================================================

          if [ -f work/methurepos.db.tar.gz ]; then

              echo
              echo "=========================================="
              echo "EXISTING DATABASE FOUND"
              echo "=========================================="

              cp \
                work/methurepos.db.tar.gz \
                /tmp/methurepo/methurepos.db.tar.gz

          else

              echo
              echo "=========================================="
              echo "NO DATABASE FOUND"
              echo "=========================================="

              echo "Creating new repository database."

              touch \
                /tmp/methurepo/methurepos.db.tar.gz

          fi


          # ========================================================
          # READ EXISTING PACKAGES
          # ========================================================

          rm -rf /tmp/methurepo/db

          mkdir -p /tmp/methurepo/db


          EXISTING=""

          if [ -s /tmp/methurepo/methurepos.db.tar.gz ]; then

              bsdtar \
                -xzf \
                /tmp/methurepo/methurepos.db.tar.gz \
                -C \
                /tmp/methurepo/db \
                2>/dev/null || true

          fi


          if find /tmp/methurepo/db \
              -type f \
              -name desc \
              | grep -q .; then

              EXISTING=$(
                for desc in /tmp/methurepo/db/*/desc; do

                  [ -f "$desc" ] || continue

                  name=""
                  version=""
                  filename=""

                  while IFS= read -r line; do

                    case "$line" in

                      "%NAME%")
                        IFS= read -r name
                        ;;

                      "%VERSION%")
                        IFS= read -r version
                        ;;

                      "%FILENAME%")
                        IFS= read -r filename
                        ;;

                    esac

                  done < "$desc"

                  if [ -n "$name" ]; then

                    printf "%s\t%s\t%s\n" \
                      "$name" \
                      "$version" \
                      "$filename"

                  fi

                done
              )

          fi


          echo
          echo "=========================================="
          echo "EXISTING PACKAGES"
          echo "=========================================="


          if [ -n "$EXISTING" ]; then
            printf "%s\n" "$EXISTING"
          else
            echo "Database is empty."
          fi


          # ========================================================
          # DETERMINE PACKAGES TO ADD
          # ========================================================

          rm -rf /tmp/methurepo/add

          mkdir -p /tmp/methurepo/add


          echo
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="


          shopt -s nullglob


          packages=(
            /work/work/packages/*.pkg.tar.zst
          )


          ADD_COUNT=0


          for pkg in "${packages[@]}"; do

              filename="$(basename "$pkg")"


              # Extract Name and Version directly using standard pacman output
              pkg_info="$(pacman -Qip "$pkg")"
              name="$(echo "$pkg_info" | awk -F ': ' '/^Name/ {print $2}' | xargs)"
              version="$(echo "$pkg_info" | awk -F ': ' '/^Version/ {print $2}' | xargs)"


              echo
              echo "Checking: $filename"
              echo "Package:  $name"
              echo "Version:  $version"


              existing_line="$(
                printf "%s\n" "$EXISTING" |
                awk -F "\t" \
                  -v name="$name" \
                  "\$1 == name {print; exit}"
              )"


              # ====================================================
              # NEW PACKAGE
              # ====================================================

              if [ -z "$existing_line" ]; then

                  echo "-> NEW"

                  cp \
                    "$pkg" \
                    "/tmp/methurepo/add/$filename"

                  ADD_COUNT=$((ADD_COUNT + 1))

                  continue

              fi


              old_version="$(
                printf "%s\n" "$existing_line" |
                cut -f2
              )"


              old_filename="$(
                printf "%s\n" "$existing_line" |
                cut -f3
              )"


              # ====================================================
              # SAME PACKAGE
              # ====================================================

              if [ "$old_filename" = "$filename" ]; then

                  echo "-> UNCHANGED"

                  continue

              fi


              # ====================================================
              # UPDATED PACKAGE
              # ====================================================

              echo "-> UPDATED"

              echo "Old version: $old_version"
              echo "New version: $version"


              cp \
                "$pkg" \
                "/tmp/methurepo/add/$filename"

              ADD_COUNT=$((ADD_COUNT + 1))

          done


          # ========================================================
          # NOTHING NEW
          # ========================================================

          echo
          echo "=========================================="
          echo "RESULT"
          echo "=========================================="


          if [ "$ADD_COUNT" -eq 0 ]; then

              echo "No new or updated packages."

              echo "Existing database will remain untouched."

              exit 0

          fi


          echo "Packages to add/update: $ADD_COUNT"


          # ========================================================
          # ADD PACKAGES
          # ========================================================

          echo
          echo "=========================================="
          echo "UPDATING DATABASE"
          echo "=========================================="


          add_packages=(
            /tmp/methurepo/add/*.pkg.tar.zst
          )


          repo-add \
            --remove \
            /tmp/methurepo/methurepos.db.tar.gz \
            "${add_packages[@]}"


          # ========================================================
          # VERIFY
          # ========================================================

          echo
          echo "=========================================="
          echo "VERIFYING DATABASE"
          echo "=========================================="


          test -s \
            /tmp/methurepo/methurepos.db.tar.gz


          rm -rf /tmp/methurepo/verify

          mkdir -p /tmp/methurepo/verify


          bsdtar \
            -xzf \
            /tmp/methurepo/methurepos.db.tar.gz \
            -C \
            /tmp/methurepo/verify


          PACKAGE_COUNT=$(
            find /tmp/methurepo/verify \
              -type f \
              -name desc \
              | wc -l
          )


          echo "Packages in database: $PACKAGE_COUNT"


          if [ "$PACKAGE_COUNT" -eq 0 ]; then

              echo "ERROR: Database is empty."

              exit 1

          fi


          # ========================================================
          # COMMIT
          # ========================================================

          echo
          echo "=========================================="
          echo "COMMITTING DATABASE"
          echo "=========================================="


          cp \
            /tmp/methurepo/methurepos.db.tar.gz \
            work/methurepos.db.tar.gz


          echo
          echo "Database successfully generated."

          ls -lh \
            work/methurepos.db.tar.gz

          '


      # ============================================================
      # UPLOAD DATABASE
      # ============================================================

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f work/methurepos.db.tar.gz ]; then

            echo "No changes were required."
            echo "Nothing to upload."

            exit 0

          fi


          echo "Uploading new database..."


          gh release upload mr \
            work/methurepos.db.tar.gz \
            --repo Methusan105/archconfig \
            --clobber


          echo
          echo "Database uploaded successfully."


      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        run: |
          echo
          echo "=========================================="
          echo "METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          ls -lh work/methurepos.db.tar.gz 2>/dev/null || true
