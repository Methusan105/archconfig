name: MethuRepo - Add Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # DOWNLOAD EXISTING DB IF IT EXISTS
      # ============================================================

      - name: Download existing database if available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work/packages

          echo "Checking for existing methurepos database..."

          if gh release download mr \
              --repo Methusan105/archconfig \
              --pattern 'methurepos.db*' \
              --dir work \
              --clobber; then

              echo "Existing database found."
              ls -lh work/methurepos.db*
          else
              echo "No existing database found."
              echo "A new database will be created."
              rm -f work/methurepos.db*
          fi


      # ============================================================
      # DOWNLOAD ALL PACKAGES FROM MR
      # ============================================================

      - name: Download packages from mr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "Downloading packages from mr..."

          gh release download mr \
            --repo Methusan105/archconfig \
            --pattern '*.pkg.tar.zst' \
            --dir work/packages \
            --clobber

          echo
          echo "Packages found:"

          find work/packages \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            | sort

          COUNT=$(find work/packages \
            -type f \
            -name '*.pkg.tar.zst' \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .pkg.tar.zst packages found in mr."
            exit 1
          fi

          echo
          echo "Total packages: $COUNT"


      # ============================================================
      # UPDATE REPOSITORY (DOCKER)
      # ============================================================

      - name: Update repository database
        run: |
          set -Eeuo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash << 'EOF'
          set -Eeuo pipefail

          cd /work

          echo
          echo "=========================================="
          echo "INSTALLING ARCH REPOSITORY TOOLS"
          echo "=========================================="
          pacman -Sy --noconfirm pacman-contrib bsdtar

          rm -rf /tmp/methurepo
          mkdir -p /tmp/methurepo/db /tmp/methurepo/add

          # Handle existing database
          if [ -f work/methurepos.db.tar.gz ]; then
              echo "Existing database found."
              cp work/methurepos.db.tar.gz /tmp/methurepo/methurepos.db.tar.gz
          elif [ -f work/methurepos.db ]; then
              echo "Existing database file found."
              cp work/methurepos.db /tmp/methurepo/methurepos.db.tar.gz
          fi

          # Read existing packages from DB
          EXISTING=""
          if [ -s /tmp/methurepo/methurepos.db.tar.gz ]; then
              bsdtar -xzf /tmp/methurepo/methurepos.db.tar.gz -C /tmp/methurepo/db 2>/dev/null || true
          fi

          if find /tmp/methurepo/db -type f -name desc | grep -q .; then
              EXISTING=$(
                for desc in /tmp/methurepo/db/*/desc; do
                  [ -f "$desc" ] || continue
                  name=""
                  version=""
                  filename=""

                  while IFS= read -r line; do
                    case "$line" in
                      "%NAME%")     IFS= read -r name ;;
                      "%VERSION%")  IFS= read -r version ;;
                      "%FILENAME%") IFS= read -r filename ;;
                    esac
                  done < "$desc"

                  if [ -n "$name" ]; then
                    printf "%s\t%s\t%s\n" "$name" "$version" "$filename"
                  fi
                done
              )
          fi

          echo
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="

          shopt -s nullglob
          packages=( /work/work/packages/*.pkg.tar.zst )
          ADD_COUNT=0

          for pkg in "${packages[@]}"; do
              filename="$(basename "$pkg")"

              pkg_info="$(pacman -Qip "$pkg")"
              name="$(echo "$pkg_info" | awk -F ': ' '/^Name/ {print $2}' | xargs)"
              version="$(echo "$pkg_info" | awk -F ': ' '/^Version/ {print $2}' | xargs)"

              echo "Checking: $filename"
              echo "Package:  $name"
              echo "Version:  $version"

              existing_line="$(
                printf "%s\n" "$EXISTING" |
                awk -F "\t" -v name="$name" '$1 == name {print; exit}'
              )"

              if [ -z "$existing_line" ]; then
                  echo "-> NEW"
                  cp "$pkg" "/tmp/methurepo/add/$filename"
                  ADD_COUNT=$((ADD_COUNT + 1))
                  continue
              fi

              old_filename="$(printf "%s\n" "$existing_line" | cut -f3)"

              if [ "$old_filename" = "$filename" ]; then
                  echo "-> UNCHANGED"
                  continue
              fi

              echo "-> UPDATED"
              cp "$pkg" "/tmp/methurepo/add/$filename"
              ADD_COUNT=$((ADD_COUNT + 1))
          done

          if [ "$ADD_COUNT" -eq 0 ]; then
              echo "No new or updated packages. Database remains untouched."
              exit 0
          fi

          echo
          echo "=========================================="
          echo "UPDATING DATABASE WITH REPO-ADD"
          echo "=========================================="

          add_packages=( /tmp/methurepo/add/*.pkg.tar.zst )

          # repo-add generates both methurepos.db.tar.gz and methurepos.db
          repo-add \
            --remove \
            /tmp/methurepo/methurepos.db.tar.gz \
            "${add_packages[@]}"

          # Copy both database representations (actual file and tar archive)
          cp /tmp/methurepo/methurepos.db.tar.gz work/methurepos.db.tar.gz
          
          # Since GitHub release uploads don't support symlinks properly, copy the content
          cp -L /tmp/methurepo/methurepos.db work/methurepos.db 2>/dev/null || cp work/methurepos.db.tar.gz work/methurepos.db

          if [ -f /tmp/methurepo/methurepos.files ]; then
            cp -L /tmp/methurepo/methurepos.files work/methurepos.files 2>/dev/null || true
            cp /tmp/methurepo/methurepos.files.tar.gz work/methurepos.files.tar.gz 2>/dev/null || true
          fi

          echo "Database successfully generated:"
          ls -lh work/methurepos.db*
          EOF


      # ============================================================
      # UPLOAD DATABASE
      # ============================================================

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f work/methurepos.db ]; then
            echo "No changes were required. Nothing to upload."
            exit 0
          fi

          echo "Uploading database files..."

          # Upload both methurepos.db and methurepos.db.tar.gz
          gh release upload mr \
            work/methurepos.db* \
            --repo Methusan105/archconfig \
            --clobber

          echo "Database files uploaded successfully."


      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        run: |
          echo
          echo "=========================================="
          echo "METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          ls -lh work/methurepos.db* 2>/dev/null || true
