name: MethuRepo - Add Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-packages:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. SETUP WORK DIRECTORY & DOWNLOAD EXISTING DB
      # ============================================================

      - name: Download existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p work/db_extract work/packages work/add

          echo "Checking for existing repository database..."

          if gh release download mr \
              --repo Methusan105/archconfig \
              --pattern 'methurepos.db*' \
              --dir work \
              --clobber; then
              echo "Existing database downloaded."
              ls -lh work/methurepos.db*
          else
              echo "No database found. A fresh one will be created."
          fi

      # ============================================================
      # 2. FILTER & DOWNLOAD ONLY UNREGISTERED/NEW PACKAGES
      # ============================================================

      - name: Determine missing packages and download selectively
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Extract current DB entries
          : > work/db_filenames.txt

          if [ -s work/methurepos.db.tar.gz ]; then
              tar -xzf work/methurepos.db.tar.gz -C work/db_extract 2>/dev/null || true

              for desc in work/db_extract/*/desc; do
                  [ -f "$desc" ] || continue
                  awk '/^%FILENAME%/ {getline; print}' "$desc" >> work/db_filenames.txt
              done
          fi

          echo "=== PACKAGES ALREADY IN DATABASE ==="
          cat work/db_filenames.txt | sort || true
          echo "===================================="

          # Fetch list of release assets via GitHub CLI
          echo "Fetching release asset list..."
          gh release view mr \
            --repo Methusan105/archconfig \
            --json assets \
            --jq '.assets[].name' \
            | grep '\.pkg\.tar\.zst$' > work/all_release_pkgs.txt || true

          # Identify packages present in release assets BUT missing in DB
          : > work/download_list.txt

          while IFS= read -r asset; do
              [ -n "$asset" ] || continue

              if grep -qx "$asset" work/db_filenames.txt; then
                  echo "SKIP (Already in DB): $asset"
              else
                  echo "DOWNLOAD NEEDED: $asset"
                  echo "$asset" >> work/download_list.txt
              fi
          done < work/all_release_pkgs.txt

          DOWNLOAD_COUNT=$(wc -l < work/download_list.txt)

          echo
          echo "Total new/updated packages to download: $DOWNLOAD_COUNT"

          if [ "$DOWNLOAD_COUNT" -eq 0 ]; then
              echo "NO_NEW_PACKAGES=true" >> $GITHUB_ENV
              exit 0
          fi

          # Download only the filtered missing/updated packages
          while IFS= read -r pkg_name; do
              gh release download mr \
                --repo Methusan105/archconfig \
                --pattern "$pkg_name" \
                --dir work/packages \
                --clobber
          done < work/download_list.txt

      # ============================================================
      # 3. UPDATE DATABASE WITH REPO-ADD (DOCKER)
      # ============================================================

      - name: Update repository database
        if: env.NO_NEW_PACKAGES != 'true'
        run: |
          set -Eeuo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            archlinux:latest \
            bash << 'EOF'
          set -Eeuo pipefail

          cd /work

          echo
          echo "=========================================="
          echo "INSTALLING ARCH REPOSITORY TOOLS"
          echo "=========================================="
          pacman -Sy --noconfirm pacman-contrib libarchive

          rm -rf /tmp/methurepo
          mkdir -p /tmp/methurepo

          if [ -f work/methurepos.db.tar.gz ]; then
              cp work/methurepos.db.tar.gz /tmp/methurepo/methurepos.db.tar.gz
          fi

          shopt -s nullglob
          new_packages=( /work/work/packages/*.pkg.tar.zst )

          if [ ${#new_packages[@]} -eq 0 ]; then
              echo "No new packages found to process."
              exit 0
          fi

          echo
          echo "=========================================="
          echo "RUNNING REPO-ADD"
          echo "=========================================="

          repo-add \
            --remove \
            /tmp/methurepo/methurepos.db.tar.gz \
            "${new_packages[@]}"

          cp /tmp/methurepo/methurepos.db.tar.gz work/methurepos.db.tar.gz
          
          # Maintain physical file copy for GitHub Release asset compatibility
          cp -L /tmp/methurepo/methurepos.db work/methurepos.db 2>/dev/null || cp work/methurepos.db.tar.gz work/methurepos.db

          if [ -f /tmp/methurepo/methurepos.files ]; then
            cp -L /tmp/methurepo/methurepos.files work/methurepos.files 2>/dev/null || true
            cp /tmp/methurepo/methurepos.files.tar.gz work/methurepos.files.tar.gz 2>/dev/null || true
          fi

          echo "Database successfully updated."
          ls -lh work/methurepos.db*
          EOF

      # ============================================================
      # 4. UPLOAD UPDATED DATABASE
      # ============================================================

      - name: Upload updated database
        if: env.NO_NEW_PACKAGES != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ ! -f work/methurepos.db ]; then
            echo "No changes required. Skipping upload."
            exit 0
          fi

          echo "Uploading database files..."

          gh release upload mr \
            work/methurepos.db* \
            --repo Methusan105/archconfig \
            --clobber

          echo "Database uploaded successfully."

      # ============================================================
      # 5. COMPLETE
      # ============================================================

      - name: Complete
        run: |
          echo "=========================================="
          echo "METHUREPOS UPDATE COMPLETE"
          echo "=========================================="

          ls -lh work/methurepos.db* 2>/dev/null || true
