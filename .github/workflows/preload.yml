name: Preload Arch Linux Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Konfigurer Arch Linux Archive speil
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/08/01/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: System oppdatering og installasjon av verktøy
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed pacman-contrib e2fsprogs coreutils util-linux arch-install-scripts

      - name: Opprett mapper
        run: |
          mkdir -p build/pkg

      - name: Last ned alle pakker og avhengigheter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/pkg
          mkdir -p /tmp/pacman-db/sync

          cat > /tmp/pacman-offline.conf <<'EOF'
          [options]
          Architecture = auto
          DBPath = /tmp/pacman-db
          CacheDir = /tmp/pacman-cache
          SigLevel = Optional TrustAll

          [core]
          Server = https://archive.archlinux.org/repos/2026/08/01/$repo/os/$arch

          [extra]
          Server = https://archive.archlinux.org/repos/2026/08/01/$repo/os/$arch
          EOF

          mkdir -p /tmp/pacman-cache

          # Synkroniser pakkedatabasene uten å installere pakker
          pacman --config /tmp/pacman-offline.conf -Syy --noconfirm

          # Last ned pakkene og avhengighetene uten å installere dem
          pacman --config /tmp/pacman-offline.conf \
            --cachedir "$PWD/build/pkg" \
            --noconfirm \
            -Sw \
            base base-devel sudo \
            linux-zen linux-firmware grub networkmanager \
            mkinitcpio gnome gdm bluez bluez-utils \
            mesa intel-media-driver vulkan-intel \
            gnome-terminal nautilus zip unzip \
            vlc vlc-plugins-all mission-center \
            transmission-gtk aria2 ntfs-3g fastfetch \
            gnome-keyring epiphany ffmpeg libnotify glib2 sox \
            gnome-text-editor cpupower hdparm qalculate-gtk \
            zoxide baobab axel pacman-contrib

          # Kontroller at arkivet faktisk inneholder pakker
          echo "Antall nedlastede pakker:"
          find build/pkg -maxdepth 1 -type f -name '*.pkg.tar.*' | wc -l

          # Avbryt hvis ingen pakker ble lastet ned
          test -n "$(find build/pkg -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)"

      - name: Generer lokal pakkedatabase
        run: |
          cd build/pkg
          repo-add ./custom.db.tar.zst *.pkg.tar.zst

      - name: Opprett dynamisk ext4 image og splitt om nødvendig
        run: |
          SIZE_MB=$(du -sm build/pkg | awk '{print $1}')
          IMG_SIZE=$((SIZE_MB + 512))

          fallocate -l ${IMG_SIZE}M arch-offline-packages.img
          mkfs.ext4 arch-offline-packages.img

          mkdir -p mnt_img
          mount arch-offline-packages.img mnt_img
          mkdir -p mnt_img/repo
          cp -r build/pkg mnt_img/repo/

          if [ -f "user_configuration.json" ]; then
            cp user_configuration.json mnt_img/repo/
          fi

          sync
          umount mnt_img

          FILE_SIZE=$(stat -c%s arch-offline-packages.img)
          MAX_SIZE=2147483648

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Filen er større enn 2 GB. Splitter opp i deler..."
            split -b 1800M -d arch-offline-packages.img arch-offline-packages.img.
            rm arch-offline-packages.img
          fi

      - name: Last opp IMG-fil(er) til GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arch-offline-packages.img*
          tag_name: "latest"
          name: "Arch Offline Packages"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
