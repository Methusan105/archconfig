name: Preload Arch Linux Packages

on:
  workflow_dispatch: # Gjør det mulig å starte prosessen manuelt fra Actions-fanen

# Denne seksjonen gir skriptet lov til å opprette en Release og laste opp ZIP-filen
permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Konfigurer Arch Linux Archive speil
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/08/01/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: System oppdatering og installasjon av verktøy
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed pacman-contrib zip

      - name: Opprett mapper
        run: |
          mkdir -p build/pkg

      - name: Last ned alle pakker og avhengigheter
        run: |
          pacman -Sw --noconfirm --cachedir build/pkg \
          base base-devel linux-zen linux-firmware grub networkmanager \
          gnome gdm bluez bluez-utils mesa intel-media-driver vulkan-intel \
          gnome-terminal nautilus zip unzip vlc vlc-plugins-all \
          mission-center transmission-gtk aria2 ntfs-3g fastfetch \
          gnome-keyring epiphany ffmpeg libnotify glib2 sox \
          gnome-text-editor cpupower hdparm qalculate-gtk zoxide \
          baobab axel pacman-contrib

      - name: Generer lokal pakkedatabase
        run: |
          cd build/pkg
          repo-add ./custom.db.tar.zst *.pkg.tar.zst

      - name: Inkluder json-konfigurasjon og pakk til ZIP
        run: |
          if [ -f "user_configuration.json" ]; then
            cp user_configuration.json build/
          fi
          cd build
          zip -r ../arch-offline-packages.zip .

      - name: Last opp ZIP-filen til GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: arch-offline-packages.zip
          tag_name: "latest" # Tvinger taggen til å hete 'latest' i stedet for refs/heads/main
          name: "Arch Offline Packages"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
